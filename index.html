<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegação Acessível Autónoma</title>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; }
        
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn-start { background: #00ff88; color: #000; width: 100%; max-width: 450px; margin-bottom: 10px; font-size: 1.1rem; }
        .btn-upload { background: #0088ff; color: #fff; width: 100%; max-width: 450px; margin-bottom: 20px; font-size: 1.1rem; text-align: center; display: inline-block; box-sizing: border-box; padding: 15px; border-radius: 10px;}
        
        /* Estilo do Botão Gigante de Acessibilidade */
        #btn-ouvir { width: 100%; height: 120px; background: #ffaa00; color: #000; font-size: 1.3rem; border-radius: 15px; border: none; margin-top: 10px; font-weight: bold; box-shadow: 0 8px 15px rgba(255, 170, 0, 0.3); text-transform: uppercase; }
        #btn-ouvir:active { background: #e69900; transform: scale(0.98); }

        #status-box { padding: 20px; background: #111; border-radius: 15px; text-align: center; width: 100%; max-width: 450px; border: 2px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        #direcao-texto { font-size: 1.5rem; color: #00ff88; font-weight: bold; margin: 10px 0; min-height: 1.5em; text-transform: uppercase; }
        #instrucao { color: #ccc; font-size: 0.9rem; }
        
        .alerta-andar { display: none; margin-top: 10px; padding: 10px; background: rgba(255, 170, 0, 0.2); border: 2px solid #ffaa00; border-radius: 8px; color: #ffaa00; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; animation: piscar 1.5s infinite; }
        @keyframes piscar { 50% { opacity: 0.6; } }

        #preview-imagem { width: 200px; height: 200px; object-fit: cover; border: 3px solid #0088ff; border-radius: 20px; display: none; margin-bottom: 20px; background: #111; }
        input[type="file"] { display: none; }
        
        #debug-ia { font-size: 0.75rem; background: #222; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: left; word-wrap: break-word; line-height: 1.4; border: 1px dashed #555;}
    </style>
</head>
<body>

    <h1>Navegação Acessível</h1>
    
    <button class="btn-start" id="btn-init" onclick="init()">1. INICIAR SISTEMA (CARREGAR IA)</button>
    
    <label for="image-upload" class="btn-upload" id="label-upload" style="display: none; cursor: pointer;">
        📸 TIRAR FOTO PARA SE LOCALIZAR
    </label>
    <input type="file" id="image-upload" accept="image/*" capture="environment" onchange="processarImagem(event)">

    <img id="preview-imagem" alt="Pré-visualização da imagem">

    <div id="status-box">
        <div id="instrucao">Aguardando comando de voz...</div>
        <div id="direcao-texto">---</div>
        <div id="alerta-andar" class="alerta-andar">⚠️ Mudança de Andar</div>
        <div id="local-atual" style="font-size: 0.9rem; color: #888; margin-top: 10px; font-weight: bold;">Posição: Desconhecida</div>
        
        <div id="debug-ia">🧠 <b>Painel Raio-X:</b> Aguardando análise...</div>
    </div>

    <!-- BOTÃO DE ACESSIBILIDADE PARA DESTINO -->
    <div style="width: 100%; max-width: 450px;">
        <button id="btn-ouvir" onclick="ativarMicrofone()">
            🎤 Toque para falar o destino
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const MODELOS_URLS = {
            0: "https://teachablemachine.withgoogle.com/models/gPTMKh0iV/",
            1: "https://teachablemachine.withgoogle.com/models/m8i3tW5uf/",
            2: "https://teachablemachine.withgoogle.com/models/N6xHCcS5t/"
        };
        let modelosCarregados = {};

        const locais = {
            "Portaria": { x: 439, y: 18, z: 0, vizinhos: ["Caminho entrada"], silencioso: false },
            "Caminho entrada": { x: 434, y: 107, z: 0, vizinhos: ["Portaria", "Rampa maior"], silencioso: false },
            "Refeitorio fora": { x: 373, y: 191, z: 0, vizinhos: ["Refeitorio"], silencioso: false },
            "Refeitorio": { x: 328, y: 258, z: 0, vizinhos: ["Refeitorio fora", "Saida do refeitório"], silencioso: false },
            "Saida do refeitório": { x: 107, y: 418, z: 0, vizinhos: ["Refeitorio", "Rampa maior"], silencioso: true },

            "Rampa maior": { x: 443, y: 369, z: 0, vizinhos: ["Caminho entrada", "Saida do refeitório", "Rampa menor", "Centro"], silencioso: false }, 
            "Rampa menor": { x: 413, y: 427, z: 0, vizinhos: ["Rampa maior", "patio"], silencioso: false },
            "patio": { x: 534, y: 512, z: 0, vizinhos: ["Rampa menor", "patio central"], silencioso: false }, 

            "biblioteca": { x: 200, y: 600, z: 0, vizinhos: ["corredor biblioteca"], silencioso: false },
            "corredor biblioteca": { x: 300, y: 600, z: 0, vizinhos: ["caminho centro", "biblioteca"], silencioso: false },
            
            "caminho centro": { x: 400, y: 600, z: 0, vizinhos: ["corredor biblioteca", "Central", "caminho cantina", "Escada0", "rampa0"], silencioso: false },
            "Central": { x: 450, y: 600, z: 0, vizinhos: ["caminho centro", "patio central", "rampa0", "caminho cantina", "Escada0"], silencioso: false },
            
            "caminho cantina": { x: 400, y: 700, z: 0, vizinhos: ["Central", "cantina", "caminho centro"], silencioso: false },
            "cantina": { x: 400, y: 800, z: 0, vizinhos: ["caminho cantina"], silencioso: false },
            "Escada0": { x: 450, y: 650, z: 0, vizinhos: ["patio central", "caminho centro", "Central"], silencioso: false },
            
            "patio central": { x: 500, y: 600, z: 0, vizinhos: ["Escada0", "Central", "rampa0", "patio"], silencioso: false },
            
            "rampa0": { x: 600, y: 600, z: 0, vizinhos: ["patio central", "caminho centro", "Central", "rampa2"], silencioso: false },
            "rampa2": { x: 600, y: 600, z: 1, vizinhos: ["rampa0", "Centro", "rampa3", "corredor central"], silencioso: false },
            "rampa3": { x: 650, y: 600, z: 1, vizinhos: ["rampa2", "rampa4", "Centro", "corredor central"], silencioso: false },
            "rampa4": { x: 700, y: 600, z: 2, vizinhos: ["rampa3"], silencioso: false },

            "corredor central": { x: 600, y: 500, z: 1, vizinhos: ["Centro", "rampa2", "rampa3"], silencioso: false },
            "Centro": { x: 700, y: 500, z: 1, vizinhos: ["corredor central", "corredor esquerda", "corredor direita", "Rampa maior", "rampa2", "rampa3"], silencioso: false },
            "corredor esquerda": { x: 800, y: 500, z: 1, vizinhos: ["Centro"], silencioso: false },
            "corredor direita": { x: 900, y: 500, z: 1, vizinhos: ["Centro"], silencioso: false }
        };

        let destinoAtual = null, localIdentificado = null, ultimaFala = "";
        
        const synth = window.speechSynthesis;
        let vozPreferida = null;

        function carregarVozes() {
            let vozes = synth.getVoices();
            let vozesPtBr = vozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
            if (vozesPtBr.length > 0) {
                vozPreferida = vozesPtBr.find(v => v.name.includes('Google') || v.name.includes('Francisca') || v.name.includes('Antonio') || v.name.includes('Luciana'));
                if (!vozPreferida) vozPreferida = vozesPtBr[0];
            }
        }
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = carregarVozes;

        function falar(texto) {
            if (texto === ultimaFala) return; 
            ultimaFala = texto;
            synth.cancel(); 
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR';
            if (vozPreferida) utter.voice = vozPreferida;
            utter.rate = 1.05;  
            synth.speak(utter);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            
            recognition.onstart = () => {
                if (navigator.vibrate) navigator.vibrate(50);
            };

            recognition.onresult = (event) => {
                const fala = event.results[0][0].transcript.toLowerCase();
                let debugUI = document.getElementById("debug-ia");
                
                let destinoEncontrado = null;
                const chavesLocais = Object.keys(locais);
                
                for (let local of chavesLocais) {
                    if (fala.includes(local.toLowerCase()) && !locais[local].silencioso) {
                        destinoEncontrado = local;
                        break;
                    }
                }

                if (destinoEncontrado) {
                    debugUI.innerHTML = `🗣️ Voz detectou: "${fala}"<br>✅ Destino definido: <b>${destinoEncontrado}</b>`;
                    falar(`Destino configurado para ${destinoEncontrado}. Se desejar, tire uma foto para começar.`);
                    setDestino(destinoEncontrado);
                } else {
                    debugUI.innerHTML = `🗣️ Voz detectou: "${fala}"<br>❌ Local não encontrado no mapa.`;
                    falar("Não encontrei esse local. Toque no botão e tente novamente.");
                }
            };

            recognition.onerror = (event) => {
                falar("Não consegui ouvir. Tente novamente.");
            };
        }

        function ativarMicrofone() {
            if (!recognition) {
                falar("Seu navegador não suporta reconhecimento de voz.");
                return;
            }
            falar("Diga o seu destino após o bipe.");
            setTimeout(() => {
                try { recognition.start(); } catch(e) {}
            }, 2500); 
        }

        function calcularDistancia(a, b) {
            return Math.sqrt(
                Math.pow(locais[a].x - locais[b].x, 2) + 
                Math.pow(locais[a].y - locais[b].y, 2) + 
                Math.pow((locais[a].z - locais[b].z) * 150, 2) 
            );
        }

        function algoritmoAStar(inicio, fim) {
            let openSet = [inicio], veioDe = {}, gScore = {}, fScore = {};
            Object.keys(locais).forEach(l => { gScore[l] = Infinity; fScore[l] = Infinity; });
            gScore[inicio] = 0; fScore[inicio] = calcularDistancia(inicio, fim);

            while (openSet.length > 0) {
                let atual = openSet.reduce((a, b) => fScore[a] < fScore[b] ? a : b);
                if (atual === fim) {
                    let caminho = [atual];
                    while (veioDe[atual]) { atual = veioDe[atual]; caminho.push(atual); }
                    return caminho.reverse();
                }
                openSet = openSet.filter(item => item !== atual);
                
                locais[atual].vizinhos.forEach(v => {
                    if (!locais[v]) return;
                    let tentativeGScore = gScore[atual] + calcularDistancia(atual, v);
                    if (tentativeGScore < gScore[v]) {
                        veioDe[v] = atual;
                        gScore[v] = tentativeGScore;
                        fScore[v] = gScore[v] + calcularDistancia(v, fim);
                        if (!openSet.includes(v)) openSet.push(v);
                    }
                });
            }
            return null;
        }

        function atualizarNavegacao(posicaoAtual) {
            const alertaUI = document.getElementById("alerta-andar");
            alertaUI.style.display = "none";

            if (!destinoAtual) {
                falar("Você está em " + posicaoAtual + ". Toque no botão amarelo para dizer onde deseja ir.");
                return;
            }

            if (posicaoAtual === destinoAtual) {
                document.getElementById("direcao-texto").innerText = "VOCÊ CHEGOU!";
                falar("Você chegou ao seu destino.");
                return;
            }

            const caminho = algoritmoAStar(posicaoAtual, destinoAtual);
            if (caminho && caminho.length > 1) {
                const proximo = caminho[1];
                let instrucao = locais[proximo].silencioso ? "Siga pelo caminho atual" : "Siga para " + proximo;
                
                const zAtual = locais[posicaoAtual].z;
                const zProximo = locais[proximo].z;
                const zDestino = locais[destinoAtual].z;

                if (proximo === "Rampa maior" && zDestino > 0) {
                    instrucao = "Para chegar no segundo andar mais rápido, vá para a rampa maior e suba. Se não, continue reto até a rampa menor.";
                } else if (posicaoAtual === "Rampa menor" && zProximo > zAtual) {
                    alertaUI.style.display = "block";
                    alertaUI.innerText = `⚠️ Suba a Rampa Menor para o andar ${zProximo}`;
                    instrucao = `Você chegou na rampa menor. Agora suba, seguindo sempre o corrimão à esquerda.`;
                } else if (zProximo > zAtual) {
                    alertaUI.style.display = "block";
                    alertaUI.innerText = `⚠️ Suba para o andar ${zProximo} (Corrimão à Esquerda)`;
                    instrucao = `Suba em direção a ${proximo}, seguindo sempre o corrimão à esquerda.`;
                } else if (zProximo < zAtual) {
                    alertaUI.style.display = "block";
                    alertaUI.innerText = `⚠️ Desça para o andar ${zProximo} (Corrimão à Direita)`;
                    instrucao = `Desça em direção a ${proximo}, seguindo sempre o corrimão à direita.`;
                }

                document.getElementById("direcao-texto").innerText = proximo;
                falar(instrucao);
            } else {
                document.getElementById("direcao-texto").innerText = "CAMINHO INACESSÍVEL";
            }
        }

        function setDestino(local) {
            destinoAtual = local;
            document.getElementById("instrucao").innerText = "Indo para: " + local;
            if(localIdentificado) atualizarNavegacao(localIdentificado);
        }

        function obterClassesPermitidas(inicio) {
            if (!inicio || !locais[inicio]) return null; 

            let permitidos = [inicio];
            let visitados = [inicio];
            let fila = [inicio];

            while(fila.length > 0) {
                let atual = fila.shift();
                locais[atual].vizinhos.forEach(v => {
                    if (!visitados.includes(v)) {
                        visitados.push(v);
                        if (locais[v].silencioso) {
                            fila.push(v); 
                        } else {
                            permitidos.push(v); 
                        }
                    }
                });
            }
            return permitidos;
        }

        async function init() {
            document.getElementById("btn-init").innerText = "BAIXANDO REDES NEURAIS...";
            
            modelosCarregados[0] = await tmImage.load(MODELOS_URLS[0] + "model.json", MODELOS_URLS[0] + "metadata.json");
            modelosCarregados[1] = await tmImage.load(MODELOS_URLS[1] + "model.json", MODELOS_URLS[1] + "metadata.json");
            modelosCarregados[2] = await tmImage.load(MODELOS_URLS[2] + "model.json", MODELOS_URLS[2] + "metadata.json");
            
            document.getElementById("btn-init").style.display = "none";
            document.getElementById("label-upload").style.display = "block"; 
            
            falar("Sistema pronto. Toque no botão inferior para dizer seu destino.");
        }

        function processarImagem(event) {
            const file = event.target.files[0];
            if (!file) return;

            const imgElement = document.getElementById("preview-imagem");
            imgElement.src = URL.createObjectURL(file);
            imgElement.style.display = "block";
            
            document.getElementById("debug-ia").innerText = `🧠 Analisando ambiente...`;

            imgElement.onload = async () => {
                await predictUpload(imgElement);
            };
        }

        async function predictUpload(imageElement) {
            let classesPermitidas = obterClassesPermitidas(localIdentificado);
            let andaresParaTestar = new Set();
            
            // LOCALIZAÇÃO GLOBAL: Se o sistema não sabe onde está, procura em TODOS os andares
            if (!localIdentificado) {
                andaresParaTestar = new Set([0, 1, 2]);
            } else {
                // Se já sabe, procura apenas nos vizinhos físicos permitidos
                andaresParaTestar.add(locais[localIdentificado].z);
                if (classesPermitidas) {
                    classesPermitidas.forEach(c => {
                        if(locais[c]) andaresParaTestar.add(locais[c].z);
                    });
                }
            }

            let melhor = "", max = 0;
            let textoIA_Bruta = ""; 
            let textoFiltro = "";

            for (let andar of andaresParaTestar) {
                let modeloAtivo = modelosCarregados[andar];
                if (!modeloAtivo) continue;

                const prediction = await modeloAtivo.predict(imageElement);
                if (!localIdentificado) textoIA_Bruta += `<br><b>Andar ${andar}:</b> `;

                for(let i=0; i<modeloAtivo.getTotalClasses(); i++) {
                    let nomeClasse = prediction[i].className;
                    let prob = prediction[i].probability;
                    
                    if (prob > 0.05) {
                        textoIA_Bruta += `${nomeClasse}: ${(prob * 100).toFixed(0)}% | `;
                    }
                    
                    let bloqueado = false;
                    // Só aplica o filtro de vizinhos se já soubermos de onde estamos partindo
                    if (localIdentificado !== null && classesPermitidas !== null) {
                        if (!classesPermitidas.includes(nomeClasse)) bloqueado = true;
                    }

                    if (bloqueado) continue; 

                    if (prob > 0.01) { 
                        textoFiltro += `${nomeClasse} (Z=${andar}): ${(prob * 100).toFixed(0)}% | `;
                    }

                    // Se estivermos perdidos, exigimos uma precisão maior (40%) para o primeiro palpite
                    let limiteAceitacao = localIdentificado ? 0.20 : 0.40;
                    
                    if(prob > limiteAceitacao && prob > max) {
                        max = prob; 
                        melhor = nomeClasse;
                    }
                }
            }

            document.getElementById("debug-ia").innerHTML = 
                `<span style="color:#aaa;">🧠 <b>Visão Bruta:</b>${textoIA_Bruta || "Nada claro"}</span><br><br>
                 <span style="color:#00ff88;">🛡️ <b>Passou no Filtro:</b><br>${textoFiltro || "Nenhuma classe detectada"}</span>`;

            if(melhor !== "") {
                if(locais[melhor]) {
                    localIdentificado = melhor;
                    document.getElementById("local-atual").innerHTML = `<span style="color: #00ff88;">🖼️ Local Confirmado: ${melhor} (Andar ${locais[melhor].z})</span>`;
                    atualizarNavegacao(melhor);
                } else {
                    document.getElementById("local-atual").innerHTML = `<span style="color: red;">❌ Erro crítico: A IA retornou '${melhor}', mas ele não existe.</span>`;
                }
            } else {
                document.getElementById("local-atual").innerHTML = `<span style="color: #ffaa00;">⚠️ Não reconheci o local. Tire uma foto mais nítida do corredor.</span>`;
                if (!localIdentificado) falar("Ainda não sei onde estamos. Por favor, tire outra foto do ambiente.");
            }
        }
    </script>
</body>
</html>

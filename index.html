<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Navegação - Indoor Federal</title>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #webcam-container { width: 200px; height: 200px; border: 2px solid #444; border-radius: 20px; overflow: hidden; margin-bottom: 20px; display: none; }
        
        .painel-teste { background: #222; padding: 15px; border-radius: 15px; width: 100%; max-width: 450px; margin-bottom: 20px; border: 1px dashed #777; }
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-start { background: #00ff88; color: #000; width: 100%; margin-bottom: 20px; font-size: 1.1rem; }
        .btn-local { background: #333; color: #fff; border: 1px solid #555; }
        .btn-local.origem-ativa { background: #ffaa00; color: #000; }
        .btn-local.destino-ativo { background: #00ff88; color: #000; }

        #status-box { padding: 20px; background: #111; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; border: 2px solid #00ff88; }
        #direcao-texto { font-size: 1.4rem; color: #00ff88; font-weight: bold; margin: 10px 0; min-height: 1.5em; }
        h4 { margin: 5px 0; color: #aaa; text-transform: uppercase; font-size: 0.7rem; }
    </style>
</head>
<body>

    <h1>Simulador de Navegação</h1>
    <button class="btn-start" id="btn-init" onclick="init()">LIGAR CÂMERA (OPCIONAL)</button>

    <div class="painel-teste">
        <h4>1. Onde você está agora? (Simular Origem)</h4>
        <div class="grid-botoes" id="menu-origem"></div>
        
        <h4 style="margin-top:20px;">2. Para onde quer ir? (Destino)</h4>
        <div class="grid-botoes" id="menu-destino"></div>
    </div>

    <div id="webcam-container"></div>

    <div id="status-box">
        <div id="instrucao">Selecione Origem e Destino no painel acima</div>
        <div id="direcao-texto">---</div>
        <div id="local-atual" style="font-size: 0.8rem; color: #888;">Modo Simulação</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/qvqu9nB4J/";
        
        // Dados baseados nos seus arquivos [cite: 3, 4, 7]
        const locais = {
            "Portaria": { x: 439, y: 18, vizinhos: ["Caminho entrada"], silencioso: false },
            "Caminho entrada": { x: 434, y: 107, vizinhos: ["Portaria", "ConexaoA", "Curva Rampa Maior"], silencioso: false },
            "Refeitorio fora": { x: 373, y: 191, vizinhos: ["ConexaoA", "Refeitorio"], silencioso: false },
            "Refeitorio": { x: 328, y: 258, vizinhos: ["Refeitorio fora", "Saida do refeitório"], silencioso: false },
            "Rampa maior": { x: 443, y: 369, vizinhos: ["Curva Rampa Maior", "Curva rampa menor"], silencioso: false },
            "Rampa menor": { x: 413, y: 427, vizinhos: ["Curva rampa menor", "Caminho para o patio"], silencioso: false },
            "Caminho para o patio": { x: 523, y: 427, vizinhos: ["Rampa menor", "patio"], silencioso: false },
            "patio": { x: 534, y: 512, vizinhos: ["Caminho para o patio"], silencioso: false },

            // Nós de curva [cite: 3]
            "ConexaoA": { x: 222, y: 256, vizinhos: ["Caminho entrada", "Refeitorio fora"], silencioso: true },
            "Curva Rampa Maior": { x: 219, y: 425, vizinhos: ["Caminho entrada", "Rampa maior", "Saida do refeitório"], silencioso: true },
            "Curva rampa menor": { x: 220, y: 488, vizinhos: ["Curva Rampa Maior", "Rampa menor"], silencioso: true },
            "Saida do refeitório": { x: 107, y: 418, vizinhos: ["Refeitorio", "Curva Rampa Maior"], silencioso: true }
        };

        let model, webcam, destinoAtual = null, posicaoSimulada = null, ultimaClasseFalada = "";
        const synth = window.speechSynthesis;

        function calcularDistancia(a, b) {
            return Math.sqrt(Math.pow(locais[a].x - locais[b].x, 2) + Math.pow(locais[a].y - locais[b].y, 2));
        }

        function algoritmoAStar(inicio, fim) {
            let openSet = [inicio], veioDe = {}, gScore = {}, fScore = {};
            Object.keys(locais).forEach(l => { gScore[l] = Infinity; fScore[l] = Infinity; });
            gScore[inicio] = 0; fScore[inicio] = calcularDistancia(inicio, fim);

            while (openSet.length > 0) {
                let atual = openSet.reduce((a, b) => fScore[a] < fScore[b] ? a : b);
                if (atual === fim) {
                    let caminho = [atual];
                    while (veioDe[atual]) { atual = veioDe[atual]; caminho.push(atual); }
                    return caminho.reverse();
                }
                openSet = openSet.filter(item => item !== atual);
                
                locais[atual].vizinhos.forEach(v => {
                    if (!locais[v]) return;
                    let tentativeGScore = gScore[atual] + calcularDistancia(atual, v);
                    if (tentativeGScore < gScore[v]) {
                        veioDe[v] = atual;
                        gScore[v] = tentativeGScore;
                        fScore[v] = gScore[v] + calcularDistancia(v, fim);
                        if (!openSet.includes(v)) openSet.push(v);
                    }
                });
            }
            return null;
        }

        function falar(texto) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR';
            synth.speak(utter);
        }

        function processarNavegacao(posicaoAtual) {
            if (!destinoAtual) return;

            // Alerta Rampa Maior -> Pátio
            if (posicaoAtual === "Rampa maior" && (destinoAtual === "patio" || destinoAtual === "Caminho para o patio")) {
                falar("Atenção: não suba! Siga reto para a rampa menor.");
                document.getElementById("direcao-texto").innerText = "⚠ NÃO SUBA! SIGA RETO";
                return;
            }

            if (posicaoAtual === destinoAtual) {
                falar("Você chegou ao destino.");
                document.getElementById("direcao-texto").innerText = "CHEGOU!";
                return;
            }

            const caminho = algoritmoAStar(posicaoAtual, destinoAtual);
            if (caminho && caminho.length > 1) {
                const proximo = caminho[1];
                let instrucao = locais[proximo].silencioso ? "Siga pelo caminho" : "Vá para " + proximo;
                document.getElementById("direcao-texto").innerText = proximo;
                falar(instrucao);
            } else {
                document.getElementById("direcao-texto").innerText = "Caminho não encontrado";
            }
        }

        // --- FUNÇÕES DO SIMULADOR ---
        function setOrigem(local) {
            posicaoSimulada = local;
            document.querySelectorAll('#menu-origem .btn-local').forEach(b => b.classList.remove('origem-ativa'));
            event.target.classList.add('origem-ativa');
            document.getElementById("local-atual").innerText = "Simulando em: " + local;
            processarNavegacao(local);
        }

        function setDestino(local) {
            destinoAtual = local;
            document.querySelectorAll('#menu-destino .btn-local').forEach(b => b.classList.remove('destino-ativo'));
            event.target.classList.add('destino-ativo');
            document.getElementById("instrucao").innerText = "Indo para: " + local;
            if(posicaoSimulada) processarNavegacao(posicaoSimulada);
        }

        function montarMenus() {
            const mOrigem = document.getElementById("menu-origem");
            const mDestino = document.getElementById("menu-destino");
            
            Object.keys(locais).forEach(local => {
                // Botão de Origem (inclui curvas para você testar se o cálculo funciona nelas)
                const btnO = document.createElement("button");
                btnO.className = "btn-local";
                btnO.innerText = local;
                btnO.onclick = (e) => setOrigem(local);
                mOrigem.appendChild(btnO);

                // Botão de Destino (apenas locais reais)
                if (!locais[local].silencioso) {
                    const btnD = document.createElement("button");
                    btnD.className = "btn-local";
                    btnD.innerText = local;
                    btnD.onclick = (e) => setDestino(local);
                    mDestino.appendChild(btnD);
                }
            });
        }

        async function init() {
            document.getElementById("btn-init").innerText = "CARREGANDO MODELO...";
            model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            webcam = new tmImage.Webcam(200, 200, true);
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            document.getElementById("webcam-container").style.display = "block";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            document.getElementById("btn-init").style.display = "none";
            window.requestAnimationFrame(loop);
        }

        async function loop() { 
            webcam.update(); 
            const prediction = await model.predict(webcam.canvas);
            let melhor = "", max = 0;
            for(let i=0; i<model.getTotalClasses(); i++) {
                if(prediction[i].probability > 0.90 && prediction[i].probability > max) {
                    max = prediction[i].probability; melhor = prediction[i].className;
                }
            }
            if(melhor !== "" && melhor !== ultimaClasseFalada) {
                ultimaClasseFalada = melhor;
                posicaoSimulada = melhor; // Câmera sobrescreve a simulação manual
                document.getElementById("local-atual").innerText = "📍 Câmera: " + melhor;
                processarNavegacao(melhor);
            }
            window.requestAnimationFrame(loop); 
        }

        window.onload = montarMenus;
    </script>
</body>
</html>

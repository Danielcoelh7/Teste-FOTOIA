<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Indoor Acessível - Federal</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #000; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        h1 { color: #00ff88; font-size: 1.5rem; text-align: center; margin-bottom: 10px; }
        
        #webcam-container { 
            width: 280px; 
            height: 280px; 
            border: 4px solid #00ff88; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 20px;
            display: none; 
            background: #111;
        }

        .menu-destinos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            display: none;
        }

        button {
            padding: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-start { 
            background-color: #00ff88; 
            color: #000; 
            width: 100%; 
            max-width: 400px;
            margin-bottom: 20px; 
            font-size: 1.2rem;
        }

        .btn-destino { background-color: #1a1a1a; color: #fff; border: 2px solid #333; }
        .btn-destino.ativo { border-color: #00ff88; background-color: #004425; }

        #status-box {
            margin-top: 15px;
            padding: 20px;
            background: #111;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #00ff88;
            min-height: 100px;
        }

        #proximo-passo {
            font-size: 1.3rem;
            margin-top: 10px;
            color: #00ff88;
            font-weight: bold;
        }

        #local-atual {
            font-size: 0.85rem;
            color: #888;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <h1>Assistente de Navegação</h1>
    
    <button class="btn-start" id="btn-init" onclick="init()">ATIVAR SISTEMA</button>

    <div id="webcam-container"></div>

    <div id="status-box">
        <div id="instrucao">Selecione um destino para começar</div>
        <div id="proximo-passo"></div>
        <div id="local-atual">Aguardando câmera...</div>
    </div>

    <h3 id="titulo-destinos" style="display:none; margin-top:20px;">Para onde deseja ir?</h3>
    <div class="menu-destinos" id="menu-destinos"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/qvqu9nB4J/";
        
        // Mapeamento de Coordenadas  e Conexões 
        const locais = {
            "Portaria": { x: 222.1860, y: 576.5740, vizinhos: ["Caminho entrada"] },
            "Caminho entrada": { x: 294.9800, y: 583.5000, vizinhos: ["Portaria", "Refeitorio fora", "Rampa maior"] },
            "Refeitorio fora": { x: 402.0000, y: 606.0000, vizinhos: ["Caminho entrada", "Refeitorio"] },
            "Refeitorio": { x: 406.0000, y: 698.0000, vizinhos: ["Refeitorio fora", "Caminho entrada"] },
            "Rampa maior": { x: 572.0000, y: 617.0000, vizinhos: ["Caminho entrada", "Rampa menor"] },
            "Rampa menor": { x: 646.0000, y: 612.0000, vizinhos: ["Rampa maior", "Caminho para o patio"] },
            "Caminho para o patio": { x: 670.0000, y: 441.0000, vizinhos: ["Rampa menor", "Patio"] },
            "Patio": { x: 740.0000, y: 450.0000, vizinhos: ["Caminho para o patio"] }
        };

        let model, webcam, destinoAtual = null, ultimaClasseFalada = "";
        const synth = window.speechSynthesis;

        // --- ALGORITMO A* ---
        function calcularDistancia(a, b) {
            return Math.sqrt(Math.pow(locais[a].x - locais[b].x, 2) + Math.pow(locais[a].y - locais[b].y, 2));
        }

        function algoritmoAStar(inicio, fim) {
            let openSet = [inicio];
            let veioDe = {};
            let gScore = {}; 
            let fScore = {}; 

            Object.keys(locais).forEach(l => {
                gScore[l] = Infinity;
                fScore[l] = Infinity;
            });

            gScore[inicio] = 0;
            fScore[inicio] = calcularDistancia(inicio, fim);

            while (openSet.length > 0) {
                let atual = openSet.reduce((a, b) => fScore[a] < fScore[b] ? a : b);

                if (atual === fim) {
                    let caminho = [atual];
                    while (veioDe[atual]) {
                        atual = veioDe[atual];
                        caminho.push(atual);
                    }
                    return caminho.reverse();
                }

                openSet = openSet.filter(item => item !== atual);

                if (locais[atual] && locais[atual].vizinhos) {
                    locais[atual].vizinhos.forEach(vizinho => {
                        let tentativeGScore = gScore[atual] + calcularDistancia(atual, vizinho);
                        if (tentativeGScore < gScore[vizinho]) {
                            veioDe[vizinho] = atual;
                            gScore[vizinho] = tentativeGScore;
                            fScore[vizinho] = gScore[vizinho] + calcularDistancia(vizinho, fim);
                            if (!openSet.includes(vizinho)) openSet.push(vizinho);
                        }
                    });
                }
            }
            return null;
        }

        // --- INTERAÇÃO E VOZ ---
        function falar(texto) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            synth.speak(utterance);
        }

        function gerarMenu() {
            const menu = document.getElementById("menu-destinos");
            menu.innerHTML = "";
            Object.keys(locais).forEach(local => {
                const btn = document.createElement("button");
                btn.className = "btn-destino";
                btn.innerText = local;
                btn.onclick = () => {
                    destinoAtual = local;
                    document.querySelectorAll('.btn-destino').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    falar("Destino definido para " + local);
                    document.getElementById("instrucao").innerText = "Indo para: " + local;
                };
                menu.appendChild(btn);
            });
        }

        // --- SISTEMA PRINCIPAL ---
        async function init() {
            document.getElementById("btn-init").style.display = "none";
            document.getElementById("webcam-container").style.display = "block";
            document.getElementById("menu-destinos").style.display = "grid";
            document.getElementById("titulo-destinos").style.display = "block";
            
            falar("Iniciando sistema. Por favor, escolha seu destino.");

            model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            
            webcam = new tmImage.Webcam(280, 280, true);
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            gerarMenu();
            window.requestAnimationFrame(loop);
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let melhorClasse = "";
            let maiorProb = 0;

            for (let i = 0; i < model.getTotalClasses(); i++) {
                if (prediction[i].probability > 0.85 && prediction[i].probability > maiorProb) {
                    maiorProb = prediction[i].probability;
                    melhorClasse = prediction[i].className;
                }
            }

            if (melhorClasse !== "" && melhorClasse !== ultimaClasseFalada) {
                ultimaClasseFalada = melhorClasse;
                document.getElementById("local-atual").innerText = "📍 Local: " + melhorClasse;
                processarNavegacao(melhorClasse);
            }
        }

        function processarNavegacao(posicaoAtual) {
            if (!destinoAtual) {
                falar("Você está em " + posicaoAtual + ". Selecione um destino.");
                return;
            }

            // AVISO DE SEGURANÇA: Rampa Maior -> Pátio
            if (posicaoAtual === "Rampa maior" && (destinoAtual === "Patio" || destinoAtual === "Caminho para o patio")) {
                falar("Atenção! Não suba a rampa. Siga reto para a rampa menor.");
                document.getElementById("proximo-passo").innerText = "⚠ NÃO SUBA! SIGA RETO";
                document.getElementById("proximo-passo").style.color = "#ff4444";
                return;
            } else {
                document.getElementById("proximo-passo").style.color = "#00ff88";
            }

            if (posicaoAtual === destinoAtual) {
                falar("Você chegou ao seu destino: " + destinoAtual);
                document.getElementById("proximo-passo").innerText = "VOCÊ CHEGOU!";
                return;
            }

            const caminho = algoritmoAStar(posicaoAtual, destinoAtual);
            
            if (caminho && caminho.length > 1) {
                const proximoPonto = caminho[1];
                document.getElementById("proximo-passo").innerText = "Siga para: " + proximoPonto;
                falar("Siga de " + posicaoAtual + " para " + proximoPonto);
            } else {
                falar("Caminho não encontrado. Tente se reposicionar.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Indoor Acessível</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #000; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        h1 { color: #00ff88; font-size: 1.5rem; text-align: center; }
        
        #webcam-container { 
            width: 250px; 
            height: 250px; 
            border: 4px solid #00ff88; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 20px;
            display: none; /* Escondido até o início */
        }

        .menu-destinos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-start { background-color: #00ff88; color: #000; width: 100%; margin-bottom: 20px; }
        .btn-destino { background-color: #1a1a1a; color: #fff; border: 2px solid #333; }
        .btn-destino.ativo { border-color: #00ff88; background-color: #004425; }

        #status-box {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #00ff88;
        }
    </style>
</head>
<body>

    <h1>Assistente de Navegação</h1>
    
    <button class="btn-start" id="btn-init" onclick="init()">ATIVAR SISTEMA</button>

    <div id="webcam-container"></div>

    <div id="status-box">
        <div id="instrucao">Aguardando início...</div>
        <div id="local-atual" style="font-size: 0.8rem; color: #888; margin-top: 10px;"></div>
    </div>

    <h3 id="titulo-destinos" style="display:none; margin-top:30px;">Para onde deseja ir?</h3>
    <div class="menu-destinos" id="menu-destinos" style="display:none;">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/qvqu9nB4J/";
        
        // Banco de dados baseado na sua contagem
        const mapaPassos = {
            "Entrada": 0,
            "Refeitório": 80,
            "Rampa Maior": 120,
            "Pátio": 170,
            "Bebedouro": 185,
            "Centro": 210,
            "Salas Especiais": 225,
            "Biblioteca": 250,
            "Cantina": 250
        };

        let model, webcam, labelContainer, maxPredictions;
        let ultimaClasseFalada = "";
        let destinoAtual = null;
        const synth = window.speechSynthesis;

        // Função de fala com prioridade
        function falar(texto) {
            synth.cancel(); // Para fala anterior para não atrasar a navegação
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            synth.speak(utterance);
        }

        // Gera os botões de destino
        function gerarMenu() {
            const menu = document.getElementById("menu-destinos");
            Object.keys(mapaPassos).forEach(local => {
                if(local === "Entrada") return;
                const btn = document.createElement("button");
                btn.className = "btn-destino";
                btn.innerText = local;
                btn.onclick = () => selecionarDestino(local, btn);
                menu.appendChild(btn);
            });
        }

        function selecionarDestino(local, btn) {
            destinoAtual = local;
            document.querySelectorAll('.btn-destino').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            falar("Destino definido para " + local + ". Aponte a câmera para os arredores.");
            document.getElementById("instrucao").innerText = "Destino: " + local;
        }

        async function init() {
            document.getElementById("btn-init").style.display = "none";
            document.getElementById("webcam-container").style.display = "block";
            document.getElementById("menu-destinos").style.display = "grid";
            document.getElementById("titulo-destinos").style.display = "block";
            
            falar("Sistema iniciado. Escolha um destino na lista abaixo.");

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(250, 250, flip);
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            gerarMenu();
            window.requestAnimationFrame(loop);
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let melhorClasse = "";
            let maiorProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > 0.85 && prediction[i].probability > maiorProb) {
                    maiorProb = prediction[i].probability;
                    melhorClasse = prediction[i].className;
                }
            }

            if (melhorClasse !== "" && melhorClasse !== ultimaClasseFalada) {
                ultimaClasseFalada = melhorClasse;
                document.getElementById("local-atual").innerText = "Local identificado: " + melhorClasse;
                
                processarNavegação(melhorClasse);
            }
        }

        function processarNavegação(localIdentificado) {
            if (!destinoAtual) {
                falar("Você está em " + localIdentificado + ". Por favor, selecione um destino.");
                return;
            }

            const passosOrigem = mapaPassos[localIdentificado];
            const passosDestino = mapaPassos[destinoAtual];
            const diferenca = passosDestino - passosOrigem;

            if (diferenca > 0) {
                falar(`Você está no ${localIdentificado}. Siga em frente por mais ${diferenca} passos até ${destinoAtual}.`);
            } else if (diferenca < 0) {
                falar(`Você está no ${localIdentificado}. O local ${destinoAtual} ficou para trás. Volte aproximadamente ${Math.abs(diferenca)} passos.`);
            } else {
                falar(`Você chegou ao destino: ${destinoAtual}.`);
            }
        }

        // Habilita vozes no iOS/Chrome
        window.speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
    </script>
</body>
</html>

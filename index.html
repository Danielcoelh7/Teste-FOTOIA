<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegação Acessível Autónoma</title>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; }
        
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn-start { background: #00ff88; color: #000; width: 100%; max-width: 450px; margin-bottom: 10px; font-size: 1.1rem; }
        .btn-upload { background: #0088ff; color: #fff; width: 100%; max-width: 450px; margin-bottom: 20px; font-size: 1.1rem; text-align: center; display: inline-block; box-sizing: border-box; padding: 15px; border-radius: 10px;}
        .btn-upload:disabled { opacity: 0.6; cursor: default; }
        
        /* Estilo do Botão Gigante de Acessibilidade */
        #btn-ouvir { width: 100%; height: 120px; background: #ffaa00; color: #000; font-size: 1.3rem; border-radius: 15px; border: none; margin-top: 10px; font-weight: bold; box-shadow: 0 8px 15px rgba(255, 170, 0, 0.3); text-transform: uppercase; }
        #btn-ouvir:active { background: #e69900; transform: scale(0.98); }

        #status-box { padding: 20px; background: #111; border-radius: 15px; text-align: center; width: 100%; max-width: 450px; border: 2px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        #direcao-texto { font-size: 1.5rem; color: #00ff88; font-weight: bold; margin: 10px 0; min-height: 1.5em; text-transform: uppercase; }
        #instrucao { color: #ccc; font-size: 0.9rem; }
        
        .alerta-andar { display: none; margin-top: 10px; padding: 10px; background: rgba(255, 170, 0, 0.2); border: 2px solid #ffaa00; border-radius: 8px; color: #ffaa00; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; animation: piscar 1.5s infinite; }
        @keyframes piscar { 50% { opacity: 0.6; } }

        #video-preview { width: 100%; max-width: 450px; border: 3px solid #0088ff; border-radius: 20px; display: none; margin-bottom: 20px; background: #111; }
        
        #debug-ia { font-size: 0.75rem; background: #222; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: left; word-wrap: break-word; line-height: 1.4; border: 1px dashed #555;}

        #btn-repetir { background: #333; color: #fff; width: 100%; max-width: 450px; margin-top: 10px; padding: 10px; font-size: 0.9rem; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Navegação Acessível</h1>
    
    <button class="btn-start" id="btn-init" onclick="init()">1. INICIAR SISTEMA (CARREGAR IA)</button>
    
    <button class="btn-upload" id="btn-camera" style="display: none;" onclick="iniciarCamera()">
        📹 INICIAR CÂMERA (LOCALIZAÇÃO CONTÍNUA)
    </button>

    <video id="video-preview" autoplay playsinline muted></video>

    <div id="status-box">
        <div id="instrucao">Aguardando...</div>
        <div id="direcao-texto">---</div>
        <div id="alerta-andar" class="alerta-andar">⚠️ Mudança de Andar</div>
        <div id="local-atual" style="font-size: 0.9rem; color: #888; margin-top: 10px; font-weight: bold;">Posição: Desconhecida</div>
        
        <div id="debug-ia">🧠 <b>Painel Raio-X:</b> Aguardando análise...</div>
    </div>

    <!-- BOTÃO DE ACESSIBILIDADE PARA DESTINO -->
    <div style="width: 100%; max-width: 450px;">
        <button id="btn-ouvir" onclick="ativarMicrofone()">
            🎤 Toque para falar
        </button>
        <button id="btn-repetir" onclick="repetirUltimaInstrucao()">
            🔁 Repetir última instrução
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

    <script>
        const MODELOS_URLS = {
            0: "https://teachablemachine.withgoogle.com/models/gPTMKh0iV/",
            1: "https://teachablemachine.withgoogle.com/models/m8i3tW5uf/",
            2: "https://teachablemachine.withgoogle.com/models/N6xHCcS5t/"
        };
        let modelosCarregados = {};

        // Intervalo (ms) entre análises de frame do vídeo. 1500ms equilibra
        // responsividade com o custo de rodar até 3 modelos de IA no navegador
        // a cada análise.
        const INTERVALO_ANALISE_MS = 1500;

        const locais = {
            "Portaria": { x: 439, y: 18, z: 0, vizinhos: ["Caminho entrada"], silencioso: false },
            "Caminho entrada": { x: 434, y: 107, z: 0, vizinhos: ["Portaria", "Rampa maior", "Entrada Refeitório"], silencioso: false },
            "Entrada Refeitório": { x: 380, y: 150, z: 0, vizinhos: ["Rampa maior", "Caminho entrada", "Refeitorio fora"], silencioso: false },
            "Refeitorio fora": { x: 373, y: 191, z: 0, vizinhos: ["Refeitorio", "Entrada Refeitório"], silencioso: false },
            "Refeitorio": { x: 328, y: 258, z: 0, vizinhos: ["Refeitorio fora", "Saida do refeitório"], silencioso: false },
            "Saida do refeitório": { x: 107, y: 418, z: 0, vizinhos: ["Refeitorio", "Rampa maior"], silencioso: true },

            "Rampa maior": { x: 443, y: 369, z: 0, vizinhos: ["Caminho entrada", "Saida do refeitório", "Rampa menor", "Centro", "Entrada Refeitório"], silencioso: false, tipo: "rampa", corrimao: "esquerda" }, 
            "Rampa menor": { x: 413, y: 427, z: 0, vizinhos: ["Rampa maior", "patio"], silencioso: false, tipo: "rampa", corrimao: "esquerda" },
            "patio": { x: 534, y: 512, z: 0, vizinhos: ["Rampa menor", "patio central"], silencioso: false }, 

            "biblioteca": { x: 200, y: 600, z: 0, vizinhos: ["corredor biblioteca"], silencioso: false },
            "corredor biblioteca": { x: 300, y: 600, z: 0, vizinhos: ["caminho centro", "biblioteca"], silencioso: false },
            
            "caminho centro": { x: 400, y: 600, z: 0, vizinhos: ["corredor biblioteca", "Central", "caminho cantina", "Escada0", "rampa0"], silencioso: false },
            "Central": { x: 450, y: 600, z: 0, vizinhos: ["caminho centro", "corredor biblioteca", "patio central", "rampa0", "caminho cantina", "Escada0"], silencioso: false },
            
            "caminho cantina": { x: 400, y: 700, z: 0, vizinhos: ["Central", "cantina", "caminho centro"], silencioso: false },
            "cantina": { x: 400, y: 800, z: 0, vizinhos: ["caminho cantina"], silencioso: false },
            "Escada0": { x: 450, y: 650, z: 0, vizinhos: ["patio central", "caminho centro", "Central"], silencioso: false },
            
            "patio central": { x: 500, y: 600, z: 0, vizinhos: ["Escada0", "Central", "patio"], silencioso: false },
            
            "rampa0": { x: 600, y: 600, z: 0, vizinhos: ["patio central", "caminho centro", "Central", "rampa2"], silencioso: false, tipo: "rampa", corrimao: "esquerda" },
            "rampa2": { x: 600, y: 600, z: 1, vizinhos: ["rampa0", "Centro", "rampa3", "corredor central"], silencioso: false, tipo: "rampa", corrimao: "esquerda" },
            "rampa3": { x: 650, y: 600, z: 1, vizinhos: ["rampa2", "rampa4", "Centro", "corredor central"], silencioso: false, tipo: "rampa", corrimao: "esquerda" },
            "rampa4": { x: 700, y: 600, z: 2, vizinhos: ["rampa3"], silencioso: false, tipo: "rampa", corrimao: "esquerda" },

            "corredor central": { x: 600, y: 500, z: 1, vizinhos: ["Centro", "rampa2", "rampa3"], silencioso: false },
            "Centro": { x: 700, y: 500, z: 1, vizinhos: ["corredor central", "corredor esquerda", "corredor direita", "Rampa maior", "rampa2", "rampa3"], silencioso: false },
            "corredor esquerda": { x: 800, y: 500, z: 1, vizinhos: ["Centro"], silencioso: false },
            "corredor direita": { x: 900, y: 500, z: 1, vizinhos: ["Centro"], silencioso: false }
        };

        // Instruções manuais por trecho de 2 pontos (origem -> destino), no
        // formato "ORIGEM|DESTINO": "texto falado/exibido". Usadas quando o
        // próximo passo do A* corresponder a um desses pares e não houver uma
        // instrução de contexto (3 pontos) mais específica (ver abaixo).
        //
        // IMPORTANTE: todo trecho com instrução manual também tem seu par de
        // volta (DESTINO -> ORIGEM) definido aqui. A volta NÃO é sempre o
        // espelho mecânico da ida (ex.: "vire à direita" virar "vire à
        // esquerda") — em alguns pontos o jeito certo de voltar é bem
        // diferente do de ir (ex.: "caminho cantina -> Central" volta pelo
        // piso tátil, mesmo a ida sendo só "siga em frente"). Cada volta foi
        // escrita pensando na direção física correta para quem está vindo do
        // sentido oposto.
        const instrucoesManuais = {
            "Portaria|Caminho entrada": "Siga em frente.",
            "Caminho entrada|Portaria": "Siga em frente.",

            "Caminho entrada|Rampa maior": "Siga em frente.",
            "Rampa maior|Caminho entrada": "Desça a rampa para ir embora, pela esquerda.",

            // Entrada Refeitório: a instrução muda dependendo de por onde a
            // pessoa chega, por isso são pares manuais diferentes em vez de
            // uma regra genérica.
            "Rampa maior|Entrada Refeitório": "Siga em frente e acompanhe o meio-fio à esquerda até a subida.",
            "Entrada Refeitório|Rampa maior": "Siga em frente até a rampa.",
            "Caminho entrada|Entrada Refeitório": "Ao acabar o meio-fio, vire à esquerda e siga reto até a porta do refeitório, que estará à esquerda.",
            "Entrada Refeitório|Caminho entrada": "Siga em frente.",
            "Entrada Refeitório|Refeitorio fora": "Siga em frente até a entrada do refeitório.",
            "Refeitorio fora|Entrada Refeitório": "Saia e siga em frente.",

            "Rampa maior|Saida do refeitório": "Vire à esquerda.",
            "Saida do refeitório|Rampa maior": "A rampa estará à direita.",

            "Rampa maior|Rampa menor": "Siga em frente.",
            "Rampa menor|Rampa maior": "Siga em frente.",

            "Rampa maior|Centro": "Vire à direita e suba a rampa.",
            "Centro|Rampa maior": "Vire à esquerda e desça a rampa.",

            "Rampa menor|patio": "Suba a rampa menor, seguindo sempre o corrimão à esquerda.",
            "patio|Rampa menor": "Desça a rampa menor, seguindo sempre o corrimão à direita.",

            "patio|patio central": "Siga em frente até o centro.",
            "patio central|patio": "Siga em frente.",

            "patio central|Central": "Siga em frente.",
            "Central|patio central": "Siga em frente.",

            "patio central|Escada0": "Siga em frente até a escada, à esquerda.",
            "Escada0|patio central": "Siga em frente.",

            "Central|corredor biblioteca": "Vire à direita até a biblioteca.",
            "corredor biblioteca|Central": "Vire à esquerda.",

            "corredor biblioteca|biblioteca": "Siga em frente.",
            "biblioteca|corredor biblioteca": "Ao sair da biblioteca, vire à esquerda.",

            "caminho centro|Central": "Siga em frente.",
            "Central|caminho centro": "Siga em frente.",

            "Central|caminho cantina": "Siga em frente.",
            // Caso especial apontado: a volta não espelha a ida (que é reta);
            // volta-se seguindo o piso tátil.
            "caminho cantina|Central": "Volte pelo piso tátil.",

            "caminho cantina|cantina": "Vire à direita e procure o piso tátil para ir à cantina.",
            "cantina|caminho cantina": "Procure o piso tátil para voltar.",

            "caminho centro|rampa0": "Siga um pouco à frente e procure a rampa ao lado direito.",
            "rampa0|caminho centro": "Vire à esquerda e siga em frente.",

            "Central|rampa0": "Vire à direita e depois à esquerda, até encontrar o piso tátil.",
            "rampa0|Central": "Desça.",

            "rampa0|rampa2": "Suba.",
            "rampa2|rampa0": "Desça.",

            "rampa2|rampa3": "Está ao lado. Continue subindo a rampa, seguindo sempre o corrimão à esquerda.",
            "rampa3|rampa2": "Está ao lado. Continue descendo a rampa, seguindo sempre o corrimão à direita.",

            "rampa3|rampa4": "Suba.",
            "rampa4|rampa3": "Desça.",

            "rampa2|Centro": "Siga em frente até o piso tátil, vire à esquerda e vire novamente à esquerda depois de andar um pouco.",
            "Centro|rampa2": "Vire à direita, siga um pouco e vire à direita novamente até o piso tátil.",

            "Centro|corredor esquerda": "Ao subir a rampa maior, vire à esquerda e ande até o piso tátil, depois vire à esquerda.",
            "corredor esquerda|Centro": "Vire à direita, siga até o piso tátil e vire à direita novamente.",

            "Centro|corredor central": "Siga o piso tátil à direita até a interligação com o piso tátil do centro.",
            "corredor central|Centro": "Siga o piso tátil à esquerda.",

            "Centro|corredor direita": "Siga apenas o piso tátil, à direita.",
            "corredor direita|Centro": "Siga apenas o piso tátil, à esquerda."
        };

        // Instruções com CONTEXTO (anterior -> atual -> próximo), no formato
        // "ANTERIOR|ATUAL|PROXIMO". Têm prioridade sobre "instrucoesManuais"
        // acima, porque o mesmo trecho ATUAL->PROXIMO pode precisar de uma
        // instrução diferente dependendo de onde a pessoa veio.
        // Ex.: chegar em "Central" vindo de "rampa0" e seguir para
        // "caminho cantina" precisa de uma instrução diferente de chegar em
        // "Central" vindo de "patio central" e seguir para "caminho cantina".
        const instrucoesComContexto = {
            "rampa0|Central|caminho cantina": "Vire à direita para procurar o piso tátil."
        };

        // Guarda a sequência de locais confirmados por foto/vídeo, na ordem em
        // que foram identificados, para permitir instruções sensíveis ao
        // trajeto (instrucoesComContexto). Não é limpo ao trocar de destino,
        // só ao reiniciar a página, pois representa o caminho físico já
        // percorrido.
        let historicoLocais = [];

        let destinoAtual = null, localIdentificado = null, ultimaFala = "";
        
        // NOVAS VARIÁVEIS DE ESTADO DA VOZ
        let andarConhecido = null; 
        let aguardandoAndar = true; 

        const synth = window.speechSynthesis;
        let vozPreferida = null;

        function carregarVozes() {
            let vozes = synth.getVoices();
            let vozesPtBr = vozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
            if (vozesPtBr.length > 0) {
                vozPreferida = vozesPtBr.find(v => v.name.includes('Google') || v.name.includes('Francisca') || v.name.includes('Antonio') || v.name.includes('Luciana'));
                if (!vozPreferida) vozPreferida = vozesPtBr[0];
            }
        }
        // Correção: algumas engines (ex.: Chrome desktop na 1ª carga) já têm as
        // vozes disponíveis e nunca disparam "onvoiceschanged". Chamamos uma vez
        // de imediato, além de manter o listener para quando carregam tarde.
        carregarVozes();
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = carregarVozes;

        function falar(texto, forcar) {
            // "forcar" permite repetir uma instrução idêntica à anterior
            // (ex.: usuário pediu para repetir, ou a IA confirmou de novo o
            // mesmo lugar em um frame seguinte).
            if (texto === ultimaFala && !forcar) return; 
            ultimaFala = texto;
            synth.cancel(); 
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR';
            if (vozPreferida) utter.voice = vozPreferida;
            utter.rate = 1.05;  
            synth.speak(utter);
        }

        function repetirUltimaInstrucao() {
            if (ultimaFala) {
                falar(ultimaFala, true);
            } else {
                falar("Ainda não há nenhuma instrução para repetir.", true);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            
            recognition.onstart = () => {
                if (navigator.vibrate) navigator.vibrate(50);
            };

            recognition.onresult = (event) => {
                const removerAcentos = (str) => {
                    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                };

                let falaOriginal = event.results[0][0].transcript.toLowerCase();
                let falaLimpa = removerAcentos(falaOriginal);
                let debugUI = document.getElementById("debug-ia");

                // ESTADO 1: APLICATIVO PRECISA SABER O ANDAR INICIAL
                if (aguardandoAndar) {
                    // Correção: usar \b (limite de palavra) em vez de "includes",
                    // porque "includes('um')" dava match em "algum", "nenhum",
                    // "lugar comum" etc, confundindo o andar detectado.
                    if (/\b(primeiro|terreo|térreo|um|1)\b/.test(falaLimpa)) {
                        andarConhecido = 0; // Mapeia "Primeiro andar" para o Z=0
                    } else if (/\b(segundo|dois|2)\b/.test(falaLimpa)) {
                        andarConhecido = 1; // Mapeia "Segundo andar" para o Z=1
                    } else if (/\b(terceiro|tres|três|3)\b/.test(falaLimpa)) {
                        andarConhecido = 2; // Mapeia "Terceiro andar" para o Z=2
                    }

                    if (andarConhecido !== null) {
                        aguardandoAndar = false; // Passa para a próxima fase
                        debugUI.innerHTML = `🗣️ Voz detectou: "${falaOriginal}"<br>✅ Andar Inicial travado: <b>Z=${andarConhecido}</b>`;
                        
                        // Emenda a fala do destino automaticamente!
                        falar(`Andar confirmado. Diga seu destino após o bipe.`);
                        setTimeout(() => { try { recognition.start(); } catch(e) {} }, 3500);
                    } else {
                        debugUI.innerHTML = `🗣️ Voz detectou: "${falaOriginal}"<br>❌ Andar não reconhecido.`;
                        falar("Não entendi o andar. Diga primeiro, segundo, ou terceiro andar.", true);
                    }
                    return; // Para a execução aqui para não tentar procurar o andar como se fosse um destino
                }

                // ESTADO 2: APLICATIVO PRECISA SABER O DESTINO (O Andar já foi dito)
                let destinoEncontrado = null;
                const chavesLocais = Object.keys(locais);
                
                for (let local of chavesLocais) {
                    let localLimpo = removerAcentos(local.toLowerCase());
                    if (falaLimpa.includes(localLimpo) && !locais[local].silencioso) {
                        destinoEncontrado = local;
                        break;
                    }
                }

                if (destinoEncontrado) {
                    debugUI.innerHTML = `🗣️ Voz detectou: "${falaOriginal}"<br>✅ Destino definido: <b>${destinoEncontrado}</b>`;
                    falar(`Destino configurado para ${destinoEncontrado}. Se desejar, ligue a câmera para começar a navegação.`, true);
                    setDestino(destinoEncontrado);
                } else {
                    debugUI.innerHTML = `🗣️ Voz detectou: "${falaOriginal}"<br>❌ Local não encontrado no mapa.`;
                    falar("Não encontrei esse local. Toque no botão amarelo e tente novamente.", true);
                }
            };

            recognition.onerror = (event) => {
                // Correção: tratar "não tenho permissão de microfone" de forma
                // diferente de um erro transitório de captação, já que pedir
                // para "tentar de novo" não resolve permissão negada.
                if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                    falar("O microfone está bloqueado. Habilite a permissão de microfone nas configurações do navegador e tente novamente.", true);
                } else if (event.error === "no-speech") {
                    falar("Não ouvi nada. Toque no botão amarelo e tente de novo.", true);
                } else {
                    falar("Não consegui ouvir. Tente novamente.", true);
                }
            };
        }

        function ativarMicrofone() {
            if (!recognition) {
                falar("Seu navegador não suporta reconhecimento de voz.", true);
                return;
            }
            
            // Muda a instrução dependendo da fase (Estado)
            if (aguardandoAndar) {
                falar("Para começarmos, em qual andar você está? Diga primeiro, segundo ou terceiro andar.", true);
            } else {
                falar("Diga o seu destino após o bipe.", true);
            }
            
            setTimeout(() => {
                try { recognition.start(); } catch(e) {}
            }, 3500); 
        }

        function calcularDistancia(a, b) {
            return Math.sqrt(
                Math.pow(locais[a].x - locais[b].x, 2) + 
                Math.pow(locais[a].y - locais[b].y, 2) + 
                Math.pow((locais[a].z - locais[b].z) * 150, 2) 
            );
        }

        function algoritmoAStar(inicio, fim) {
            let openSet = [inicio], veioDe = {}, gScore = {}, fScore = {};
            Object.keys(locais).forEach(l => { gScore[l] = Infinity; fScore[l] = Infinity; });
            gScore[inicio] = 0; fScore[inicio] = calcularDistancia(inicio, fim);

            while (openSet.length > 0) {
                let atual = openSet.reduce((a, b) => fScore[a] < fScore[b] ? a : b);
                if (atual === fim) {
                    let caminho = [atual];
                    while (veioDe[atual]) { atual = veioDe[atual]; caminho.push(atual); }
                    return caminho.reverse();
                }
                openSet = openSet.filter(item => item !== atual);
                
                locais[atual].vizinhos.forEach(v => {
                    if (!locais[v]) return;
                    let tentativeGScore = gScore[atual] + calcularDistancia(atual, v);
                    if (tentativeGScore < gScore[v]) {
                        veioDe[v] = atual;
                        gScore[v] = tentativeGScore;
                        fScore[v] = gScore[v] + calcularDistancia(v, fim);
                        if (!openSet.includes(v)) openSet.push(v);
                    }
                });
            }
            return null;
        }

        function atualizarNavegacao(posicaoAtual) {
            const alertaUI = document.getElementById("alerta-andar");
            alertaUI.style.display = "none";

            if (!destinoAtual) {
                return;
            }

            if (posicaoAtual === destinoAtual) {
                document.getElementById("direcao-texto").innerText = "VOCÊ CHEGOU!";
                falar("Você chegou ao seu destino.");
                return;
            }

            const caminho = algoritmoAStar(posicaoAtual, destinoAtual);
            if (caminho && caminho.length > 1) {
                const proximo = caminho[1];
                const noAtual = locais[posicaoAtual];
                const noProximo = locais[proximo];
                const zAtual = noAtual.z;
                const zProximo = noProximo.z;
                const zDestino = locais[destinoAtual].z;

                let instrucao = locais[proximo].silencioso ? "Siga pelo caminho atual" : "Siga para " + proximo;

                // O local imediatamente anterior a "posicaoAtual" no trajeto já
                // percorrido, usado para escolher a instrução de contexto certa
                // quando o mesmo trecho ATUAL->PROXIMO tem textos diferentes
                // conforme a origem (ex.: chegar em Central vindo de rampa0 x
                // vindo de patio central).
                const anterior = historicoLocais.length > 0 ? historicoLocais[historicoLocais.length - 1] : null;
                const chaveTripla = anterior ? (anterior + "|" + posicaoAtual + "|" + proximo) : null;
                const chaveManual = posicaoAtual + "|" + proximo;

                if (chaveTripla && instrucoesComContexto[chaveTripla]) {
                    // Instrução específica que depende de onde a pessoa veio.
                    instrucao = instrucoesComContexto[chaveTripla];
                    if (zProximo !== zAtual) {
                        alertaUI.style.display = "block";
                        alertaUI.innerText = zProximo > zAtual
                            ? `⚠️ Mudança de andar: subindo para o andar ${zProximo}`
                            : `⚠️ Mudança de andar: descendo para o andar ${zProximo}`;
                    }
                } else if (instrucoesManuais[chaveManual]) {
                    // Trecho com instrução específica cadastrada manualmente
                    // (frente / trás / direita / esquerda). Tem prioridade
                    // sobre a lógica genérica abaixo.
                    instrucao = instrucoesManuais[chaveManual];
                    if (zProximo !== zAtual) {
                        alertaUI.style.display = "block";
                        alertaUI.innerText = zProximo > zAtual
                            ? `⚠️ Mudança de andar: subindo para o andar ${zProximo}`
                            : `⚠️ Mudança de andar: descendo para o andar ${zProximo}`;
                    }
                } else if (noProximo.tipo === "rampa" && zProximo === zAtual && zDestino > zAtual) {
                    // Correção: em vez de comparar nomes de locais específicos
                    // ("Rampa maior"/"Rampa menor" hardcoded), usamos a
                    // propriedade genérica tipo:"rampa" + corrimao dos nós.
                    // Isso deixa a regra válida para qualquer rampa nova
                    // adicionada ao mapa, sem precisar tocar nesta função de novo.
                    instrucao = `Para chegar mais rápido, vá para ${proximo} e suba.`;
                } else if (noAtual.tipo === "rampa" && zProximo > zAtual) {
                    alertaUI.style.display = "block";
                    alertaUI.innerText = `⚠️ Suba a partir de ${posicaoAtual} para o andar ${zProximo}`;
                    instrucao = `Você chegou em ${posicaoAtual}. Agora suba, seguindo sempre o corrimão à ${noAtual.corrimao || "esquerda"}.`;
                } else if (zProximo > zAtual) {
                    alertaUI.style.display = "block";
                    alertaUI.innerText = `⚠️ Suba para o andar ${zProximo} (Corrimão à ${(noProximo.corrimao || "esquerda")})`;
                    instrucao = `Suba em direção a ${proximo}, seguindo sempre o corrimão à ${noProximo.corrimao || "esquerda"}.`;
                } else if (zProximo < zAtual) {
                    alertaUI.style.display = "block";
                    alertaUI.innerText = `⚠️ Desça para o andar ${zProximo} (Corrimão à Direita)`;
                    instrucao = `Desça em direção a ${proximo}, seguindo sempre o corrimão à direita.`;
                }

                document.getElementById("direcao-texto").innerText = proximo;
                falar(instrucao);
            } else {
                document.getElementById("direcao-texto").innerText = "CAMINHO INACESSÍVEL";
            }
        }

        function setDestino(local) {
            destinoAtual = local;
            document.getElementById("instrucao").innerText = "Indo para: " + local;
            if(localIdentificado) atualizarNavegacao(localIdentificado);
        }

        function obterClassesPermitidas(inicio) {
            if (!inicio || !locais[inicio]) return null; 

            let permitidos = [inicio];
            let visitados = [inicio];
            let fila = [inicio];

            while(fila.length > 0) {
                let atual = fila.shift();
                locais[atual].vizinhos.forEach(v => {
                    if (!visitados.includes(v)) {
                        visitados.push(v);
                        if (locais[v].silencioso) {
                            fila.push(v); 
                        } else {
                            permitidos.push(v); 
                        }
                    }
                });
            }
            return permitidos;
        }

        async function init() {
            document.getElementById("btn-init").innerText = "BAIXANDO REDES NEURAIS...";
            
            try {
                // Correção: carregar os 3 modelos em paralelo em vez de
                // sequencialmente, reduzindo bastante o tempo de inicialização.
                const [m0, m1, m2] = await Promise.all([
                    tmImage.load(MODELOS_URLS[0] + "model.json", MODELOS_URLS[0] + "metadata.json"),
                    tmImage.load(MODELOS_URLS[1] + "model.json", MODELOS_URLS[1] + "metadata.json"),
                    tmImage.load(MODELOS_URLS[2] + "model.json", MODELOS_URLS[2] + "metadata.json")
                ]);
                modelosCarregados[0] = m0;
                modelosCarregados[1] = m1;
                modelosCarregados[2] = m2;

                document.getElementById("btn-init").style.display = "none";
                document.getElementById("btn-camera").style.display = "block"; 

                falar("Sistema pronto. Toque no botão inferior para ligar a câmera e me diga em qual andar você está.");
            } catch (erro) {
                // Correção: antes, se o carregamento falhasse (rede instável,
                // CDN fora do ar, etc.), o botão ficava travado em "BAIXANDO
                // REDES NEURAIS..." para sempre, sem nenhum aviso — muito ruim
                // para quem depende só do áudio. Agora avisamos e permitimos
                // tentar de novo.
                console.error("Falha ao carregar modelos de IA:", erro);
                document.getElementById("btn-init").innerText = "1. INICIAR SISTEMA (CARREGAR IA)";
                falar("Não consegui carregar o sistema. Verifique sua conexão com a internet e toque no botão verde para tentar novamente.", true);
            }
        }

        let streamAtivo = null;
        let intervaloAnalise = null;
        let analisandoFrame = false;

        // Substitui o antigo fluxo de "tirar 1 foto -> analisar" por uma
        // câmera sempre ligada: pede a câmera traseira uma vez e, a partir
        // daí, analisa frames do próprio <video> periodicamente, sem precisar
        // de nenhuma outra ação do usuário.
        async function iniciarCamera() {
            const btnCamera = document.getElementById("btn-camera");
            const video = document.getElementById("video-preview");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                streamAtivo = stream;
                video.srcObject = stream;
                video.style.display = "block";

                btnCamera.innerText = "📹 CÂMERA ATIVA — ANALISANDO...";
                btnCamera.disabled = true;

                falar("Câmera ativada. Vou analisar o ambiente continuamente.");

                if (intervaloAnalise) clearInterval(intervaloAnalise);
                intervaloAnalise = setInterval(() => {
                    analisarFrameAtual(video);
                }, INTERVALO_ANALISE_MS);
            } catch (erro) {
                // Correção: sem esse aviso, uma permissão negada ou câmera
                // ocupada deixava a pessoa sem qualquer feedback sonoro sobre
                // o que deu errado.
                console.error("Falha ao acessar a câmera:", erro);
                falar("Não consegui acessar a câmera. Verifique a permissão de câmera nas configurações do navegador e toque no botão azul novamente.", true);
            }
        }

        async function analisarFrameAtual(video) {
            // Evita empilhar análises se uma anterior ainda estiver rodando
            // (os 3 modelos de IA podem demorar mais que o intervalo em
            // celulares mais fracos).
            if (analisandoFrame) return;
            // readyState < 2 significa que o vídeo ainda não tem um frame
            // pronto para ser lido (ex.: câmera ainda carregando).
            if (video.readyState < 2) return;

            analisandoFrame = true;
            document.getElementById("debug-ia").innerText = `🧠 Analisando ambiente com IA restrita...`;
            try {
                await predictFrame(video);
            } finally {
                analisandoFrame = false;
            }
        }

        async function predictFrame(imageElement) {
            let classesPermitidas = obterClassesPermitidas(localIdentificado);
            let andaresParaTestar = new Set();
            
            // LÓGICA DE TRIAGEM POR VOZ ATIVADA
            if (!localIdentificado) {
                if (andarConhecido !== null) {
                    // O app confia na voz e carrega APENAS a IA daquele andar (3x mais rápido e preciso)
                    andaresParaTestar = new Set([andarConhecido]);
                } else {
                    andaresParaTestar = new Set([0, 1, 2]); // Fallback se a pessoa não falou nada
                }
            } else {
                andaresParaTestar.add(locais[localIdentificado].z);
                if (classesPermitidas) {
                    classesPermitidas.forEach(c => {
                        if(locais[c]) andaresParaTestar.add(locais[c].z);
                    });
                }
            }

            let melhor = "", max = 0;
            let textoIA_Bruta = ""; 
            let textoFiltro = "";

            for (let andar of andaresParaTestar) {
                let modeloAtivo = modelosCarregados[andar];
                if (!modeloAtivo) continue;

                const prediction = await modeloAtivo.predict(imageElement);
                if (!localIdentificado) textoIA_Bruta += `<br><b>Andar ${andar}:</b> `;

                for(let i=0; i<modeloAtivo.getTotalClasses(); i++) {
                    let nomeClasse = prediction[i].className;
                    let prob = prediction[i].probability;
                    
                    if (prob > 0.05) {
                        textoIA_Bruta += `${nomeClasse}: ${(prob * 100).toFixed(0)}% | `;
                    }
                    
                    let bloqueado = false;
                    if (localIdentificado !== null && classesPermitidas !== null) {
                        if (!classesPermitidas.includes(nomeClasse)) bloqueado = true;
                    }

                    if (bloqueado) continue; 

                    if (prob > 0.01) { 
                        textoFiltro += `${nomeClasse} (Z=${andar}): ${(prob * 100).toFixed(0)}% | `;
                    }

                    let limiteAceitacao = localIdentificado ? 0.20 : 0.35;
                    
                    if(prob > limiteAceitacao && prob > max) {
                        max = prob; 
                        melhor = nomeClasse;
                    }
                }
            }

            document.getElementById("debug-ia").innerHTML = 
                `<span style="color:#aaa;">🧠 <b>Visão Bruta:</b>${textoIA_Bruta || "Nada claro"}</span><br><br>
                 <span style="color:#00ff88;">🛡️ <b>Passou no Filtro:</b><br>${textoFiltro || "Nenhuma classe detectada"}</span>`;

            if(melhor !== "") {
                if(locais[melhor]) {
                    // Guarda o local confirmado anterior no histórico ANTES de
                    // sobrescrevê-lo, para as instruções de contexto (3 pontos)
                    // saberem de onde a pessoa está vindo. Só registra quando o
                    // local muda de fato, para não poluir o histórico com
                    // frames repetidos do mesmo lugar.
                    if (localIdentificado !== null && melhor !== localIdentificado) {
                        historicoLocais.push(localIdentificado);
                        if (historicoLocais.length > 15) historicoLocais.shift();
                    }

                    localIdentificado = melhor;
                    document.getElementById("local-atual").innerHTML = `<span style="color: #00ff88;">🖼️ Local Confirmado: ${melhor} (Andar ${locais[melhor].z})</span>`;
                    atualizarNavegacao(melhor);
                } else {
                    document.getElementById("local-atual").innerHTML = `<span style="color: red;">❌ Erro crítico: A IA retornou '${melhor}', mas ele não existe.</span>`;
                }
            } else if (!localIdentificado) {
                document.getElementById("local-atual").innerHTML = `<span style="color: #ffaa00;">⚠️ Ainda não reconheci o local. Aponte a câmera para o corredor.</span>`;
            }
        }
    </script>

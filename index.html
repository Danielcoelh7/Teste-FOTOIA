<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegação Acessível Autónoma</title>
    <style>
        html, body { min-height: 100vh; }
        body { margin: 0; font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-start { background: #00ff88; color: #000; width: 100%; max-width: 450px; min-height: 140px; margin-bottom: 10px; font-size: 1.3rem; }
        #btn-foto { width: 100%; height: 110px; background: #8844ff; color: #fff; font-size: 1.3rem; border-radius: 15px; margin-top: 10px; text-transform: uppercase; }
        #btn-foto:active { transform: scale(0.98); }
        #btn-ouvir { width: 100%; height: 120px; background: #ffaa00; color: #000; font-size: 1.3rem; border-radius: 15px; margin-top: 10px; box-shadow: 0 8px 15px rgba(255,170,0,0.3); text-transform: uppercase; }
        #btn-ouvir:active { background: #e69900; transform: scale(0.98); }
        #btn-onde { background: #0088ff; color: #fff; width: 100%; height: 80px; font-size: 1.1rem; margin-top: 10px; border-radius: 15px; }
        #btn-repetir { background: #333; color: #fff; width: 100%; max-width: 450px; margin-top: 10px; padding: 10px; font-size: 0.9rem; }
        #status-box { padding: 20px; background: #111; border-radius: 15px; width: 100%; max-width: 450px; border: 2px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); box-sizing: border-box; }
        #direcao-texto { font-size: 1.5rem; color: #00ff88; font-weight: bold; margin: 10px 0; min-height: 1.5em; text-transform: uppercase; }
        #instrucao { color: #ccc; font-size: 0.9rem; }
        .alerta-andar { display: none; margin-top: 10px; padding: 10px; background: rgba(255,170,0,0.2); border: 2px solid #ffaa00; border-radius: 8px; color: #ffaa00; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; animation: piscar 1.5s infinite; }
        @keyframes piscar { 50% { opacity: 0.6; } }
        #foto-preview { width: 100%; max-width: 450px; border: 3px solid #8844ff; border-radius: 20px; display: none; margin-bottom: 20px; background: #111; }
        #debug-ia { font-size: 0.75rem; background: #222; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: left; word-wrap: break-word; line-height: 1.4; border: 1px dashed #555; }
    </style>
</head>
<body>

    <h1>Navegação Acessível</h1>

    <button class="btn-start" id="btn-init" aria-label="Toque em qualquer lugar da tela para iniciar o sistema">TOQUE EM QUALQUER LUGAR DA TELA PARA COMEÇAR</button>

    <img id="foto-preview" alt="Última foto analisada">
    <input type="file" id="input-foto" accept="image/*" multiple style="display:none;">

    <div id="status-box" aria-hidden="true">
        <div id="instrucao">Aguardando...</div>
        <div id="direcao-texto">---</div>
        <div id="alerta-andar" class="alerta-andar">⚠️ Mudança de Andar</div>
        <div id="local-atual" style="font-size: 0.9rem; color: #888; margin-top: 10px; font-weight: bold;">Posição: Desconhecida</div>
        <div id="debug-ia">🧠 <b>Painel Raio-X:</b> Aguardando análise...</div>
    </div>

    <div style="width: 100%; max-width: 450px;">
        <button id="btn-foto" onclick="escolherFoto()">📷 Enviar foto</button>
        <button id="btn-ouvir" onclick="ativarMicrofone()">🎤 Toque para falar</button>
        <button id="btn-onde" onclick="dizerOndeEstou()">📍 Onde eu estou?</button>
        <button id="btn-repetir" onclick="repetirUltimaInstrucao()">🔁 Repetir última instrução</button>
    </div>

        };

        const instrucoesManuais = {
            "Portaria|Caminho entrada": "Siga em frente.",
            "Caminho entrada|Portaria": "Siga em frente.",

            "Rampa maior|Entrada Refeitório": "Siga em frente e acompanhe o meio-fio à esquerda até a subida.",

            "Caminho entrada|Entrada Refeitório": "Ao acabar o meio-fio, vire à esquerda e siga reto até a porta do refeitório, que estará à esquerda.",

            "patio|patio central": "Siga reto aproximadamente 20 passos. Depois vire à esquerda e dê mais 20 passos. Em seguida, vire à direita e siga até o centro, em 15 passos.",
            "patio central|patio": "Siga em frente.",

            "patio central|Central": "Dê 5 passos à frente. Depois vire à direita e dê mais 15 passos.",
            "Central|patio central": "Siga em frente.",

            "patio central|Escada0": "Siga em frente até a escada, à esquerda.",
            "Escada0|patio central": "Siga em frente.",

            "Central|corredor biblioteca": "Continue em frente, dando mais 40 passos até a biblioteca.",
            "corredor biblioteca|Central": "Vire à esquerda.",

            "corredor biblioteca|biblioteca": "Siga em frente.",
            "biblioteca|corredor biblioteca": "Ao sair da biblioteca, vire à esquerda.",

            "caminho centro|Central": "Siga em frente.",
            "Central|caminho centro": "Siga em frente.",

            "Central|caminho cantina": "Vire à esquerda e, em 8 passos, você encontrará o piso tátil. Depois, siga em frente.",
            "caminho cantina|Central": "Volte pelo piso tátil.",

            "caminho cantina|cantina": "Vire à direita e procure o piso tátil para ir à cantina.",
            "cantina|caminho cantina": "Procure o piso tátil para voltar.",

            "caminho centro|rampa0": "Siga um pouco à frente e procure a rampa ao lado direito.",
            "rampa0|caminho centro": "Vire à esquerda e siga em frente.",

            "Central|rampa0": "Vire à esquerda e dê 8 passos até o piso tátil. Depois, vire à direita e você encontrará a rampa.",
            "rampa0|Central": "Desça.",

            "rampa0|rampa2": "Suba. Após subir, em 8 passos você encontrará o piso tátil.",
            "rampa2|rampa0": "Desça.",

            "rampa2|rampa3": "Está ao lado. Continue subindo a rampa, seguindo sempre o corrimão à esquerda.",
            "rampa3|rampa2": "Está ao lado. Continue descendo a rampa, seguindo sempre o corrimão à direita.",

            "rampa3|rampa4": "Suba.",
            "rampa4|rampa3": "Desça.",

            "rampa4|Superior": "Siga em frente.",
            "Superior|rampa4": "Siga em frente até a rampa e desça.",

            "Superior|Caminho laboratorio": "Vire à esquerda.",
            "Caminho laboratorio|Superior": "Vire à direita.",

            "rampa2|Centro": "Siga em frente até o piso tátil, vire à esquerda e vire novamente à esquerda depois de andar um pouco.",
            "Centro|rampa2": "Vire à direita, siga um pouco e vire à direita novamente até o piso tátil.",

            "Centro|corredor esquerda": "Ao subir a rampa maior, vire à esquerda e ande até o piso tátil, depois vire à esquerda.",
            "corredor esquerda|Centro": "Vire à direita, siga até o piso tátil e vire à direita novamente.",

            "Centro|corredor central": "Siga o piso tátil à direita até a interligação com o piso tátil do centro.",
            "corredor central|Centro": "Siga o piso tátil à esquerda.",

            "Centro|corredor direita": "Siga apenas o piso tátil, à direita.",
            "corredor direita|Centro": "Siga apenas o piso tátil, à esquerda."
        };

        const instrucoesComContexto = {
            "rampa0|Central|caminho cantina": "Vire à direita para procurar o piso tátil."
        };

        let historicoLocais = [];

        let destinoAtual = null, localIdentificado = null;
        let andarConhecido = null;
        let fase = "andar";
        let iniciado = false;
        let ultimaFala = "", ultimaInstrucao = "";
        let falando = false, falaId = 0;
        let escutando = false, micBloqueado = false;
        let candidatoLocal = null, contagemCandidato = 0;

        let audioCtx = null;
        function bipe(freq, ms) {
            if (!audioCtx) return;
            try {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.frequency.value = freq; g.gain.value = 0.15;
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + ms / 1000);
            } catch (e) {}
        }
        const PADROES = {
            esquerda: [120],
            direita:  [120, 80, 120],
            reto:     [60],
            andar:    [250, 100, 250, 100, 250],
            chegou:   [400, 120, 400],
            escuta:   [50]
        };
        function vibrar(tipo) {
            const p = PADROES[tipo] || PADROES.reto;
            if (navigator.vibrate) { navigator.vibrate(p); return; }
            let t = 0;
            p.forEach((d, i) => {
                if (i % 2 === 0) setTimeout(() => bipe(tipo === "andar" ? 520 : 800, d), t);
                t += d;
            });
        }

        const synth = window.speechSynthesis;
        let vozPreferida = null;
        function carregarVozes() {
            const ptBr = synth.getVoices().filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
            if (ptBr.length > 0) {
                vozPreferida = ptBr.find(v => /Google|Francisca|Antonio|Luciana|Felipe/.test(v.name)) || ptBr[0];
            }
        }
        carregarVozes();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = carregarVozes;

        function falar(texto, forcar) {
            if (texto === ultimaFala && !forcar) return;
            ultimaFala = texto;
            const id = ++falaId;
            falando = true;
            if (escutando && recognition) { try { recognition.abort(); } catch (e) {} }
            synth.cancel();
            setTimeout(() => {
                if (id !== falaId) return;
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'pt-BR';
                if (vozPreferida) u.voice = vozPreferida;
                u.rate = 1.05;
                const fim = () => {
                    if (id !== falaId) return;
                    falando = false;
                };
                u.onend = fim; u.onerror = fim;
                synth.speak(u);
            }, 80);
        }

        function falarInstrucao(texto, mudouAndar) {
            ultimaInstrucao = texto;
            if (mudouAndar) vibrar("andar");
            else if (/(^|\s)vire .*esquerda/i.test(texto)) vibrar("esquerda");
            else if (/(^|\s)vire .*direita/i.test(texto)) vibrar("direita");
            else vibrar("reto");
            falar(texto, true);
        }

        function repetirUltimaInstrucao() {
            if (ultimaInstrucao) falar(ultimaInstrucao, true);
            else falar("Ainda não há nenhuma instrução para repetir.", true);
        }

        function dizerOndeEstou() {
            let msg;
            if (localIdentificado) {
                msg = `Você está em ${localIdentificado}, no ${locais[localIdentificado].z + 1}º andar.`;
            } else if (andarConhecido !== null) {
                msg = `Ainda não reconheci o local exato. Você está no ${andarConhecido + 1}º andar. Envie uma foto da frente.`;
            } else {
                msg = "Ainda não sei onde você está. Envie uma foto da frente ou me diga o andar.";
            }
            falar(msg, true);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        const semAcento = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const chavesOrdenadas = Object.keys(locais).sort((a, b) => b.length - a.length);

        // Apelidos para nomes que ninguém fala naturalmente (sem acento, minúsculo)
        const APELIDOS = {
            "escada": "Escada0",
            "rampa de baixo": "rampa0",
            "rampa de cima": "rampa2",
            "pateo": "patio",
            "laboratorio": "Caminho laboratorio"
        };

        // Frases que o próprio app fala (evita reagir ao eco da própria voz)
        const ECO = /toque (na tela|no botao)|diga de novo|nao encontrei esse local|para onde voce quer ir|nao entendi|destino cancelado|em qual andar|envie uma foto|sistema pronto/;

        // Entende "primeiro", "primeira", "1º", "1o", "andar 1", "térreo", "segundo", "2º"...
        function acharAndar(f) {
            // troca qualquer símbolo (º, °, ., vírgula) por espaço e põe espaços nas pontas
            f = " " + f.replace(/[^a-z0-9]+/g, " ") + " ";
            if (/primeir|terre|baixo| (um|1|1o|1a) /.test(f)) return 0;
            if (/segund| (dois|2|2o|2a) /.test(f)) return 1;
            if (/terceir| (tres|3|3o|3a) /.test(f)) return 2;
            return null;
        }
        function acharLocal(f, soDestino) {
            for (const l of chavesOrdenadas) {
                if (f.includes(semAcento(l.toLowerCase())) && (!soDestino || !locais[l].silencioso)) return l;
            }
            for (const [apelido, real] of Object.entries(APELIDOS)) {
                if (f.includes(apelido)) return real;
            }
            return null;
        }

        function processarFala(f, original) {
            const debugUI = document.getElementById("debug-ia");
            debugUI.innerHTML = `🗣️ Voz detectou: "${original}"`;

            // CORREÇÃO LOOP: ignora o eco da própria voz do app
            if (ECO.test(f)) return;

            if (/onde (eu )?estou|onde estamos|qual (e )?(o )?(meu )?local/.test(f)) { dizerOndeEstou(); return; }
            if (/repet/.test(f)) { repetirUltimaInstrucao(); return; }
            if (/cancel|novo destino|outro destino/.test(f)) {
                destinoAtual = null; fase = "destino";
                document.getElementById("instrucao").innerText = "Sem destino";
                falar("Destino cancelado. Toque no botão laranja e diga para onde quer ir.", true); return;
            }
            if (/trocar (de )?andar|mudei de andar|outro andar/.test(f)) {
                fase = "andar";
                falar("Em qual andar você está agora? Toque no botão laranja e diga primeiro, segundo ou terceiro andar.", true); return;
            }

            if (fase === "andar") {
                const l = acharLocal(f, false);
                const a = acharAndar(f);
                if (l) {
                    localIdentificado = l; andarConhecido = locais[l].z;
                    document.getElementById("local-atual").innerHTML = `<span style="color:#00ff88;">🗣️ Local informado: ${l}</span>`;
                } else if (a !== null) {
                    andarConhecido = a;
                } else {
                    falar("Não entendi. Toque no botão laranja e diga o andar, ou o nome do lugar onde você está.", true); return;
                }
                fase = "destino";
                falar(`Certo, ${andarConhecido + 1}º andar${l ? ", perto de " + l : ""}. Para onde você quer ir? Toque no botão laranja e diga o destino.`, true);
                return;
            }

            const d = acharLocal(f, true);
            if (d) {
                debugUI.innerHTML += `<br>✅ Destino: <b>${d}</b>`;
                setDestino(d);
                if (!localIdentificado) falar(`Destino ${d}. Envie uma foto da frente para eu me localizar.`, true);
            } else {
                falar("Não encontrei esse local. Toque no botão laranja e diga de novo.", true);
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;

            recognition.onstart = () => { escutando = true; vibrar("escuta"); };
            recognition.onend = () => { escutando = false; };
            recognition.onresult = (e) => {
                const original = e.results[0][0].transcript.toLowerCase();
                processarFala(semAcento(original), original);
            };
            recognition.onerror = (e) => {
                if (e.error === "no-speech") {
                    falar("Não ouvi nada. Toque no botão laranja e fale.", true);
                    return;
                }
                if (e.error === "not-allowed" || e.error === "service-not-allowed") {
                    micBloqueado = true;
                    falar("O microfone está bloqueado. Habilite a permissão de microfone nas configurações do navegador.", true);
                }
            };
        }

        // O microfone SÓ abre quando o usuário toca (botão laranja ou tela). Nunca sozinho.
        function ouvir() {
            if (!recognition || !iniciado || falando || escutando || micBloqueado) return;
            try { recognition.start(); } catch (e) {}
        }

        function ativarMicrofone() {
            if (!recognition) { falar("Seu navegador não suporta reconhecimento de voz.", true); return; }
            micBloqueado = false;
            falaId++; falando = false; synth.cancel();
            if (escutando) { try { recognition.abort(); } catch (e) {} }
            bipe(880, 120);
            setTimeout(ouvir, 250);
        }

        function calcularDistancia(a, b) {
            return Math.sqrt(
                Math.pow(locais[a].x - locais[b].x, 2) +
                Math.pow(locais[a].y - locais[b].y, 2) +
                Math.pow((locais[a].z - locais[b].z) * 150, 2)
            );
        }

        function algoritmoAStar(inicio, fim) {
            let openSet = [inicio], veioDe = {}, gScore = {}, fScore = {};
            Object.keys(locais).forEach(l => { gScore[l] = Infinity; fScore[l] = Infinity; });
            gScore[inicio] = 0; fScore[inicio] = calcularDistancia(inicio, fim);

            while (openSet.length > 0) {
                let atual = openSet.reduce((a, b) => fScore[a] < fScore[b] ? a : b);
                if (atual === fim) {
                    let caminho = [atual];
                    while (veioDe[atual]) { atual = veioDe[atual]; caminho.push(atual); }
                    return caminho.reverse();
                }
                openSet = openSet.filter(item => item !== atual);

                locais[atual].vizinhos.forEach(v => {
                    if (!locais[v]) return;
                    let tentativeGScore = gScore[atual] + calcularDistancia(atual, v);
                    if (tentativeGScore < gScore[v]) {
                        veioDe[v] = atual;
                        gScore[v] = tentativeGScore;
                        fScore[v] = gScore[v] + calcularDistancia(v, fim);
                        if (!openSet.includes(v)) openSet.push(v);
                    }
                });
            }
            return null;
        }

        function atualizarNavegacao(posicaoAtual) {
            const alertaUI = document.getElementById("alerta-andar");
            alertaUI.style.display = "none";
            const avisoAndar = (txt) => { alertaUI.style.display = "block"; alertaUI.innerText = txt; };

            if (!destinoAtual) return;

            if (posicaoAtual === destinoAtual) {
                document.getElementById("direcao-texto").innerText = "VOCÊ CHEGOU!";
                vibrar("chegou");
                falar("Você chegou ao seu destino.", true);
                return;
            }

            const caminho = algoritmoAStar(posicaoAtual, destinoAtual);
            if (caminho && caminho.length > 1) {
                const proximo = caminho[1];
                const noAtual = locais[posicaoAtual];
                const noProximo = locais[proximo];
                const zAtual = noAtual.z;
                const zProximo = noProximo.z;
                const zDestino = locais[destinoAtual].z;

                let instrucao = noProximo.silencioso ? "Siga pelo caminho atual" : "Siga para " + proximo;

                const anterior = historicoLocais.length > 0 ? historicoLocais[historicoLocais.length - 1] : null;
                const chaveTripla = anterior ? (anterior + "|" + posicaoAtual + "|" + proximo) : null;
                const chaveManual = posicaoAtual + "|" + proximo;

                const txtMudanca = zProximo > zAtual
                    ? `⚠️ Mudança de andar: subindo para o ${zProximo + 1}º andar`
                    : `⚠️ Mudança de andar: descendo para o ${zProximo + 1}º andar`;

                if (chaveTripla && instrucoesComContexto[chaveTripla]) {
                    instrucao = instrucoesComContexto[chaveTripla];
                    if (zProximo !== zAtual) avisoAndar(txtMudanca);
                } else if (instrucoesManuais[chaveManual]) {
                    instrucao = instrucoesManuais[chaveManual];
                    if (zProximo !== zAtual) avisoAndar(txtMudanca);
                } else if (noProximo.tipo === "rampa" && zProximo === zAtual && zDestino > zAtual) {
                    instrucao = `Para chegar mais rápido, vá para ${proximo} e suba.`;
                } else if (noAtual.tipo === "rampa" && zProximo > zAtual) {
                    avisoAndar(`⚠️ Suba a partir de ${posicaoAtual} para o andar ${zProximo + 1}`);
                    instrucao = `Você chegou em ${posicaoAtual}. Agora suba, seguindo sempre o corrimão à ${noAtual.corrimao || "esquerda"}.`;
                } else if (zProximo > zAtual) {
                    avisoAndar(`⚠️ Suba para o ${zProximo + 1}º andar (Corrimão à ${(noProximo.corrimao || "esquerda")})`);
                    instrucao = `Suba em direção a ${proximo}, seguindo sempre o corrimão à ${noProximo.corrimao || "esquerda"}.`;
                } else if (zProximo < zAtual) {
                    avisoAndar(`⚠️ Desça para o ${zProximo + 1}º andar (Corrimão à Direita)`);
                    instrucao = `Desça em direção a ${proximo}, seguindo sempre o corrimão à direita.`;
                }

                document.getElementById("direcao-texto").innerText = proximo;
                falarInstrucao(instrucao, zProximo !== zAtual);
            } else {
                document.getElementById("direcao-texto").innerText = "CAMINHO INACESSÍVEL";
                falar("Não encontrei um caminho até esse destino.", true);
            }
        }

        function setDestino(local) {
            destinoAtual = local;
            document.getElementById("instrucao").innerText = "Indo para: " + local;
            if (localIdentificado) atualizarNavegacao(localIdentificado);
        }

        function obterClassesPermitidas(inicio) {
            if (!inicio || !locais[inicio]) return null;
            let permitidos = [inicio], visitados = [inicio], fila = [inicio];
            while (fila.length > 0) {
                let atual = fila.shift();
                locais[atual].vizinhos.forEach(v => {
                    if (!visitados.includes(v)) {
                        visitados.push(v);
                        if (locais[v].silencioso) fila.push(v);
                        else permitidos.push(v);
                    }
                });
            }
            return permitidos;
        }

        function desbloquearAudio() {
            try { synth.speak(new SpeechSynthesisUtterance("")); } catch (e) {}
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
            } catch (e) {}
        }

        async function carregarModelos() {
            try {
                const [m0, m1, m2] = await Promise.all([0, 1, 2].map(i =>
                    tmImage.load(MODELOS_URLS[i] + "model.json", MODELOS_URLS[i] + "metadata.json")));
                modelosCarregados = { 0: m0, 1: m1, 2: m2 };
                return true;
            } catch (erro) {
                console.error("Falha ao carregar modelos de IA:", erro);
                return false;
            }
        }

        async function iniciarTudo() {
            if (iniciado) return;
            iniciado = true;
            desbloquearAudio();
            try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}

            falar("Iniciando. Carregando o sistema, aguarde.", true);
            document.getElementById("btn-init").innerText = "CARREGANDO...";

            const modOk = await carregarModelos();
            if (!modOk) {
                iniciado = false;
                document.getElementById("btn-init").innerText = "TOQUE PARA TENTAR NOVAMENTE";
                falar("Não consegui carregar o sistema. Verifique a internet e toque na tela para tentar de novo.", true);
                return;
            }
            document.getElementById("btn-init").style.display = "none";

            fase = "andar";
            falar("Sistema pronto. O microfone só abre quando você toca no botão laranja. Toque nele e diga em qual andar você está: primeiro, segundo ou terceiro, ou o nome do lugar. " +
                "Para eu me localizar, toque no botão roxo e envie uma foto da frente. " +
                "A qualquer momento, pergunte: onde eu estou.", true);
        }

        const canvasFrame = document.createElement("canvas");
        canvasFrame.width = canvasFrame.height = 224;
        const ctxFrame = canvasFrame.getContext("2d");
        const inputFoto = document.getElementById("input-foto");
        let processandoFoto = false, urlFotoAtual = null;

        function escolherFoto() {
            if (!iniciado) { iniciarTudo(); return; }
            inputFoto.value = "";
            inputFoto.click();
        }

        inputFoto.addEventListener("change", () => {
            const arquivos = Array.from(inputFoto.files || []);
            if (arquivos.length) processarFotos(arquivos);
        });

        function carregarImagem(arquivo) {
            return new Promise((ok, erro) => {
                const url = URL.createObjectURL(arquivo);
                const img = new Image();
                img.onload = () => ok({ img, url });
                img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("imagem inválida")); };
                img.src = url;
            });
        }

        async function processarFotos(arquivos) {
            if (processandoFoto) return;
            if (!Object.keys(modelosCarregados).length) { falar("O sistema ainda está carregando. Aguarde.", true); return; }
            processandoFoto = true;
            falar("Analisando a foto.", true);
            try {
                let melhor = "", antes = localIdentificado;

                for (const arquivo of arquivos) {
                    const { img, url } = await carregarImagem(arquivo);
                    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
                    ctxFrame.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 224, 224);

                    const prev = document.getElementById("foto-preview");
                    if (urlFotoAtual) URL.revokeObjectURL(urlFotoAtual);
                    urlFotoAtual = url;
                    prev.src = url;
                    prev.style.display = "block";

                    melhor = await predictFrame(canvasFrame);
                }

                if (melhor === "") {
                    falar("Não reconheci o local nesta foto. Envie outra foto, apontando para a frente.", true);
                } else if (localIdentificado === antes) {
                    falar(`Você continua em ${melhor}. ` + (ultimaInstrucao || ""), true);
                }
            } catch (e) {
                console.error(e);
                falar("Não consegui abrir essa foto. Tente outra.", true);
            } finally {
                processandoFoto = false;
            }
        }

        function confirmarLocal(melhor) {
            if (melhor === localIdentificado) { candidatoLocal = null; contagemCandidato = 0; return; }
            if (melhor === candidatoLocal) contagemCandidato++;
            else { candidatoLocal = melhor; contagemCandidato = 1; }

            const necessarios = localIdentificado ? FRAMES_PARA_TROCAR : FRAMES_PRIMEIRO_LOCAL;
            if (contagemCandidato < necessarios) return;

            if (localIdentificado !== null) {
                historicoLocais.push(localIdentificado);
                if (historicoLocais.length > 15) historicoLocais.shift();
            }
            localIdentificado = melhor;
            andarConhecido = locais[melhor].z;
            candidatoLocal = null; contagemCandidato = 0;
            document.getElementById("local-atual").innerHTML = `<span style="color: #00ff88;">🖼️ Local Confirmado: ${melhor} (Andar ${locais[melhor].z + 1})</span>`;
            if (destinoAtual) atualizarNavegacao(melhor);
            else falar(`Você está em ${melhor}. Toque no botão laranja e diga para onde quer ir.`, true);
        }

        async function predictFrame(imageElement) {
            let classesPermitidas = obterClassesPermitidas(localIdentificado);
            let andaresParaTestar = new Set();

            if (!localIdentificado) {
                if (andarConhecido !== null) andaresParaTestar = new Set([andarConhecido]);
                else andaresParaTestar = new Set([0, 1, 2]);
            } else {
                andaresParaTestar.add(locais[localIdentificado].z);
                if (classesPermitidas) {
                    classesPermitidas.forEach(c => { if (locais[c]) andaresParaTestar.add(locais[c].z); });
                }
            }

            let melhor = "", max = 0;
            let textoIA_Bruta = "";
            let textoFiltro = "";

            for (let andar of andaresParaTestar) {
                let modeloAtivo = modelosCarregados[andar];
                if (!modeloAtivo) continue;

                const prediction = await modeloAtivo.predict(imageElement);
                if (!localIdentificado) textoIA_Bruta += `<br><b>Andar ${andar}:</b> `;

                for (let i = 0; i < modeloAtivo.getTotalClasses(); i++) {
                    let nomeClasse = prediction[i].className;
                    let prob = prediction[i].probability;

                    if (prob > 0.05) textoIA_Bruta += `${nomeClasse}: ${(prob * 100).toFixed(0)}% | `;

                    let bloqueado = false;
                    if (localIdentificado !== null && classesPermitidas !== null) {
                        if (!classesPermitidas.includes(nomeClasse)) bloqueado = true;
                    }
                    if (bloqueado) continue;

                    if (prob > 0.01) textoFiltro += `${nomeClasse} (Z=${andar}): ${(prob * 100).toFixed(0)}% | `;

                    let limiteAceitacao = localIdentificado ? 0.20 : 0.35;
                    if (prob > limiteAceitacao && prob > max) { max = prob; melhor = nomeClasse; }
                }
            }

            document.getElementById("debug-ia").innerHTML =
                `<span style="color:#aaa;">🧠 <b>Visão Bruta:</b>${textoIA_Bruta || "Nada claro"}</span><br><br>
                 <span style="color:#00ff88;">🛡️ <b>Passou no Filtro:</b><br>${textoFiltro || "Nenhuma classe detectada"}</span>`;

            if (melhor !== "") {
                if (locais[melhor]) confirmarLocal(melhor);
                else {
                    document.getElementById("local-atual").innerHTML = `<span style="color: red;">❌ Erro crítico: A IA retornou '${melhor}', mas ele não existe.</span>`;
                    return "";
                }
            } else if (!localIdentificado) {
                document.getElementById("local-atual").innerHTML = `<span style="color: #ffaa00;">⚠️ Ainda não reconheci o local. Envie outra foto do corredor.</span>`;
            }
            return melhor;
        }

        document.addEventListener("click", (e) => {
            if (!iniciado) iniciarTudo();
            else if (!e.target.closest("button, input")) ativarMicrofone();
        });
    </script>

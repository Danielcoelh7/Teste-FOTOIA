<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Guia Indoor - IFSP Cubatão</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #000; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        h1 { color: #00ff88; font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
        
        #webcam-container { 
            width: 280px; 
            height: 280px; 
            border: 4px solid #00ff88; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .menu-destinos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        button {
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-start { background-color: #00ff88; color: #000; width: 100%; margin-bottom: 20px; }
        .btn-destino { background-color: #1a1a1a; color: #fff; border: 2px solid #333; }
        .btn-destino.ativo { border-color: #00ff88; background-color: #004425; color: #00ff88; }

        #status-box {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
        #local-atual { color: #00ff88; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Assistente de Voz Indoor</h1>
    
    <button class="btn-start" id="btn-init" onclick="init()">ATIVAR CÂMERA E VOZ</button>

    <div id="webcam-container"></div>

    <div id="status-box">
        <div id="instrucao">Selecione um destino abaixo</div>
        <div id="local-atual">Aguardando IA...</div>
    </div>

    <div class="menu-destinos" id="menu-destinos" style="display:none; margin-top: 20px;">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/qvqu9nB4J/";
        
        // Mapeamento baseado nos seus dados de passos (Ponto 0 = Entrada)
        const mapaPassos = {
            "Entrada": 0,
            "Refeitório": 80,
            "Rampa Maior": 120,
            "Pátio": 170,
            "Bebedouro": 185,
            "Centro": 210,
            "Salas Especiais": 225,
            "Biblioteca": 250,
            "Cantina": 250
        };

        let model, webcam, maxPredictions;
        let ultimaClasseFalada = "";
        let destinoAtual = null;
        const synth = window.speechSynthesis;

        function falar(texto) {
            synth.cancel(); // Cancela falas antigas para priorizar a instrução atual
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1; // Um pouco mais rápido para feedback ágil
            synth.speak(utterance);
        }

        function gerarMenu() {
            const menu = document.getElementById("menu-destinos");
            Object.keys(mapaPassos).forEach(local => {
                if(local === "Entrada") return;
                const btn = document.createElement("button");
                btn.className = "btn-destino";
                btn.innerText = local;
                btn.onclick = () => {
                    destinoAtual = local;
                    document.querySelectorAll('.btn-destino').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    falar("Destino definido: " + local);
                    document.getElementById("instrucao").innerText = "Destino: " + local;
                };
                menu.appendChild(btn);
            });
        }

        async function init() {
            document.getElementById("btn-init").style.display = "none";
            document.getElementById("webcam-container").style.display = "block";
            document.getElementById("menu-destinos").style.display = "grid";
            
            falar("Sistema iniciado. Por favor, escolha para onde deseja ir.");

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(280, 280, true);
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            gerarMenu();
            window.requestAnimationFrame(loop);
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let melhorClasse = "";
            let maiorProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                // Filtro de confiança alta (90%) para evitar avisos falsos
                if (prediction[i].probability > 0.90 && prediction[i].probability > maiorProb) {
                    maiorProb = prediction[i].probability;
                    melhorClasse = prediction[i].className;
                }
            }

            // Normalização: remove espaços e ignora classes genéricas (Background/Class 1)
            const classeLimpa = melhorClasse.trim();
            if (classeLimpa !== "" && 
                classeLimpa !== "Class 1" && 
                classeLimpa !== "Background" && 
                classeLimpa !== ultimaClasseFalada) {
                
                ultimaClasseFalada = classeLimpa;
                document.getElementById("local-atual").innerText = classeLimpa;
                processarNavegacao(classeLimpa);
            }
        }

        function processarNavegacao(localIdentificado) {
            if (!destinoAtual) {
                falar("Você está em " + localIdentificado);
                return;
            }

            // Busca no mapa ignorando diferenças de maiúsculas/minúsculas
            const chaveOrigem = Object.keys(mapaPassos).find(k => k.toLowerCase() === localIdentificado.toLowerCase());
            const chaveDestino = Object.keys(mapaPassos).find(k => k.toLowerCase() === destinoAtual.toLowerCase());

            if (!chaveOrigem || !chaveDestino) return;

            const distOrigem = mapaPassos[chaveOrigem];
            const distDestino = mapaPassos[chaveDestino];
            const diferenca = distDestino - distOrigem;

            if (diferenca > 10) { 
                falar(`${chaveOrigem}. Siga em frente ${diferenca} passos.`);
            } else if (diferenca < -10) {
                falar(`${chaveOrigem}. O destino ficou para trás. Volte ${Math.abs(diferenca)} passos.`);
            } else {
                falar(`Você chegou ao destino: ${chaveDestino}.`);
                // Limpa o destino após chegar
                destinoAtual = null;
                document.getElementById("instrucao").innerText = "Você chegou!";
                document.querySelectorAll('.btn-destino').forEach(b => b.classList.remove('ativo'));
            }
        }

        window.speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Indoor Federal - Final</title>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #webcam-container { width: 220px; height: 220px; border: 3px solid #00ff88; border-radius: 20px; overflow: hidden; margin-bottom: 20px; display: none; background: #111; }
        
        .painel-teste { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 100%; max-width: 450px; margin-bottom: 20px; border: 1px dashed #444; }
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn-start { background: #00ff88; color: #000; width: 100%; margin-bottom: 20px; font-size: 1.1rem; }
        .btn-local { background: #333; color: #fff; border: 1px solid #444; }
        .btn-local.origem-ativa { background: #ffaa00; color: #000; border-color: #fff; }
        .btn-local.destino-ativo { background: #00ff88; color: #000; border-color: #fff; }

        #status-box { padding: 20px; background: #111; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; border: 2px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        #direcao-texto { font-size: 1.5rem; color: #00ff88; font-weight: bold; margin: 10px 0; min-height: 1.5em; text-transform: uppercase; }
        #instrucao { color: #ccc; font-size: 0.9rem; }
        h4 { margin: 5px 0; color: #00ff88; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <h1>Assistente de Navegação</h1>
    
    <button class="btn-start" id="btn-init" onclick="init()">ATIVAR CÂMERA E VOZ</button>

    <div id="webcam-container"></div>

    <div id="status-box">
        <div id="instrucao">Selecione um destino abaixo</div>
        <div id="direcao-texto">---</div>
        <div id="local-atual" style="font-size: 0.85rem; color: #888;">Modo Simulação Ativo</div>
    </div>

    <div class="painel-teste" style="margin-top: 20px;">
        <h4>1. Onde você está? (Origem/Teste)</h4>
        <div class="grid-botoes" id="menu-origem"></div>
        
        <h4 style="margin-top:20px;">2. Para onde deseja ir? (Destino)</h4>
        <div class="grid-botoes" id="menu-destino"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/qvqu9nB4J/";
        
        // Base de dados consolidada (Coordenadas + Vizinhos)
        const locais = {
            "Portaria": { x: 439, y: 18, vizinhos: ["Caminho entrada"], silencioso: false },
            "Caminho entrada": { x: 434, y: 107, vizinhos: ["Portaria", "ConexaoA", "Curva Rampa Maior"], silencioso: false },
            "Refeitorio fora": { x: 373, y: 191, vizinhos: ["ConexaoA", "Refeitorio"], silencioso: false },
            "Refeitorio": { x: 328, y: 258, vizinhos: ["Refeitorio fora", "Saida do refeitório"], silencioso: false },
            "Rampa maior": { x: 443, y: 369, vizinhos: ["Curva Rampa Maior", "Curva rampa menor"], silencioso: false },
            "Rampa menor": { x: 413, y: 427, vizinhos: ["Curva rampa menor", "Caminho para o patio"], silencioso: false },
            "Caminho para o patio": { x: 523, y: 427, vizinhos: ["Rampa menor", "patio"], silencioso: false },
            "patio": { x: 534, y: 512, vizinhos: ["Caminho para o patio"], silencioso: false },

            // Nós de curva e conexão (Auxiliam o A* sem poluir a voz)
            "ConexaoA": { x: 222, y: 256, vizinhos: ["Caminho entrada", "Refeitorio fora"], silencioso: true },
            "Curva Rampa Maior": { x: 219, y: 425, vizinhos: ["Caminho entrada", "Rampa maior", "Saida do refeitório"], silencioso: true },
            "Curva rampa menor": { x: 220, y: 488, vizinhos: ["Curva Rampa Maior", "Rampa menor"], silencioso: true },
            "Saida do refeitório": { x: 107, y: 418, vizinhos: ["Refeitorio", "Curva Rampa Maior"], silencioso: true }
        };

        let model, webcam, destinoAtual = null, localIdentificado = null, ultimaFala = "";
        const synth = window.speechSynthesis;

        function calcularDistancia(a, b) {
            return Math.sqrt(Math.pow(locais[a].x - locais[b].x, 2) + Math.pow(locais[a].y - locais[b].y, 2));
        }

        // Algoritmo A* para encontrar o caminho mais curto
        function algoritmoAStar(inicio, fim) {
            let openSet = [inicio], veioDe = {}, gScore = {}, fScore = {};
            Object.keys(locais).forEach(l => { gScore[l] = Infinity; fScore[l] = Infinity; });
            gScore[inicio] = 0; fScore[inicio] = calcularDistancia(inicio, fim);

            while (openSet.length > 0) {
                let atual = openSet.reduce((a, b) => fScore[a] < fScore[b] ? a : b);
                if (atual === fim) {
                    let caminho = [atual];
                    while (veioDe[atual]) { atual = veioDe[atual]; caminho.push(atual); }
                    return caminho.reverse();
                }
                openSet = openSet.filter(item => item !== atual);
                
                locais[atual].vizinhos.forEach(v => {
                    if (!locais[v]) return;
                    let tentativeGScore = gScore[atual] + calcularDistancia(atual, v);
                    if (tentativeGScore < gScore[v]) {
                        veioDe[v] = atual;
                        gScore[v] = tentativeGScore;
                        fScore[v] = gScore[v] + calcularDistancia(v, fim);
                        if (!openSet.includes(v)) openSet.push(v);
                    }
                });
            }
            return null;
        }

        function falar(texto) {
            if (texto === ultimaFala) return; // Evita repetição infinita
            ultimaFala = texto;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR';
            synth.speak(utter);
        }

        // Função principal que decide o que dizer ao usuário
        function atualizarNavegacao(posicaoAtual) {
            if (!destinoAtual) {
                falar("Você está em " + posicaoAtual + ". Para onde deseja ir?");
                return;
            }

            // Regra de segurança específica para a Rampa
            if (posicaoAtual === "Rampa maior" && (destinoAtual === "patio" || destinoAtual === "Caminho para o patio")) {
                document.getElementById("direcao-texto").innerText = "⚠ NÃO SUBA! SIGA RETO";
                falar("Atenção: não suba! Siga reto para a rampa menor.");
                return;
            }

            if (posicaoAtual === destinoAtual) {
                document.getElementById("direcao-texto").innerText = "VOCÊ CHEGOU!";
                falar("Você chegou ao seu destino.");
                return;
            }

            const caminho = algoritmoAStar(posicaoAtual, destinoAtual);
            if (caminho && caminho.length > 1) {
                const proximo = caminho[1];
                let instrucao = locais[proximo].silencioso ? "Siga pelo caminho atual" : "Siga para " + proximo;
                
                document.getElementById("direcao-texto").innerText = proximo;
                falar(instrucao);
            }
        }

        // Controle dos Botões de Teste
        function manualSetOrigem(local) {
            localIdentificado = local;
            document.querySelectorAll('#menu-origem .btn-local').forEach(b => b.classList.remove('origem-ativa'));
            event.target.classList.add('origem-ativa');
            document.getElementById("local-atual").innerText = "📍 Localização: " + local;
            atualizarNavegacao(local);
        }

        function setDestino(local) {
            destinoAtual = local;
            document.querySelectorAll('#menu-destino .btn-local').forEach(b => b.classList.remove('destino-ativo'));
            event.target.classList.add('destino-ativo');
            document.getElementById("instrucao").innerText = "Indo para: " + local;
            if(localIdentificado) atualizarNavegacao(localIdentificado);
        }

        // IA: Visão Computacional
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let melhor = "", max = 0;
            for(let i=0; i<model.getTotalClasses(); i++) {
                if(prediction[i].probability > 0.85 && prediction[i].probability > max) {
                    max = prediction[i].probability; melhor = prediction[i].className;
                }
            }

            if(melhor !== "" && melhor !== localIdentificado) {
                localIdentificado = melhor;
                document.getElementById("local-atual").innerText = "📷 Câmera detectou: " + melhor;
                atualizarNavegacao(melhor);
            }
        }

        async function init() {
            document.getElementById("btn-init").innerText = "CARREGANDO SISTEMA...";
            model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            
            webcam = new tmImage.Webcam(220, 220, true);
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            
            document.getElementById("webcam-container").style.display = "block";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            document.getElementById("btn-init").style.display = "none";
            
            window.requestAnimationFrame(loop);
            falar("Sistema pronto. Por favor, escolha um destino.");
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        // Gera a interface de botões automaticamente
        window.onload = () => {
            const mOrigem = document.getElementById("menu-origem");
            const mDestino = document.getElementById("menu-destino");
            
            Object.keys(locais).forEach(l => {
                // Menu Origem
                const btnO = document.createElement("button");
                btnO.className = "btn-local"; btnO.innerText = l;
                btnO.onclick = (e) => manualSetOrigem(l);
                mOrigem.appendChild(btnO);

                // Menu Destino (esconde as curvas técnicas)
                if (!locais[l].silencioso) {
                    const btnD = document.createElement("button");
                    btnD.className = "btn-local"; btnD.innerText = l;
                    btnD.onclick = (e) => setDestino(l);
                    mDestino.appendChild(btnD);
                }
            });
        };
    </script>
</body>
</html>
